<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22355c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="消防団になって町を火事から守ろう。吹田市消防団のアクション育成ゲーム">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>分団サバイバル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
</head>
<body>
<style>
/* Layout: full-screen action canvas (snowy town from above). HUD pinned top: coins / backpack / hearts, goal banner under it. Ride button bottom-center. Single committed daylight-snow look. */
:root{
  --ink:#1b2740; --navy:#22355c; --shu:#e5432a; --kin:#f3b648; --kin-d:#c8901f; --snow:#e9eff4;
  --wood:#b07a46; --mute:#5d6b84; --panel:rgba(255,255,255,.94); --ok:#2fa86b;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;background:var(--snow);color:var(--ink);overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}
body{font-family:var(--body);font-size:14px;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
*{box-sizing:border-box}
#cv{position:fixed;inset:0;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;pointer-events:none;display:flex;flex-direction:column;gap:7px;z-index:5}
.row{display:flex;gap:6px;align-items:center;max-width:560px;width:100%;margin:0 auto}
.pill{display:flex;align-items:center;gap:5px;background:var(--panel);border-radius:999px;padding:3px 10px 3px 3px;box-shadow:0 2px 8px rgba(27,39,64,.16);min-width:0;transition:transform .12s}
.pill b{font-family:var(--display);font-weight:400;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.coin b{font-size:20px;color:#8a5a00}
.pill.bump{transform:scale(1.14)}
.pill.full{box-shadow:0 0 0 2px var(--shu),0 2px 8px rgba(27,39,64,.16)}
.pill.full b{color:var(--shu)}
.ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.ic.coin{background:radial-gradient(circle at 40% 35%,#ffe08a,var(--kin) 55%,var(--kin-d));box-shadow:inset 0 0 0 2px var(--kin-d)}
.ic.coin::after{content:"";width:9px;height:9px;border:2px solid var(--kin-d);border-radius:50%}
.ic.bag{background:var(--wood);border-radius:8px}
.pill.sand .ic.bag{background:#cdb27a}
.ic.bag::after{content:"";width:14px;height:6px;border-radius:3px;background:#d9a46e;box-shadow:0 0 0 1.5px #7a4f2a}
.hearts{display:flex;gap:2px;padding:5px 9px;background:var(--panel);border-radius:999px;box-shadow:0 2px 8px rgba(27,39,64,.16)}
.hearts i{width:13px;height:13px;background:var(--shu);clip-path:path("M6.5 12 L1 6.2 A3.2 3.2 0 0 1 6.5 2.4 A3.2 3.2 0 0 1 12 6.2 Z")}
.hearts i.off{background:#c9d2de}
.grow{flex:1}
.rbtn{pointer-events:auto;flex:none;height:34px;min-width:34px;padding:0 10px;border-radius:999px;border:0;background:var(--panel);font-family:var(--display);font-size:12px;color:var(--ink);box-shadow:0 2px 8px rgba(27,39,64,.16);cursor:pointer}
#goal{max-width:560px;width:100%;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:12px;padding:8px 12px;box-shadow:0 4px 14px rgba(27,39,64,.25)}
#goal .tag{flex:none;font-family:var(--display);font-size:11px;background:var(--shu);border-radius:6px;padding:3px 7px;letter-spacing:.04em}
#goal p{margin:0;font-weight:700;font-size:14px;line-height:1.4;text-wrap:balance}
#goal.gold{background:#8a5a00} #goal.gold .tag{background:var(--kin);color:#4a3306}
#goal.alert{background:var(--shu)} #goal.alert .tag{background:#fff;color:var(--shu)}
#ride{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:6;border:0;border-radius:16px;background:var(--shu);color:#fff;font-family:var(--display);font-size:17px;padding:14px 26px;box-shadow:0 6px 18px rgba(229,67,42,.45),inset 0 -4px 0 rgba(0,0,0,.18);cursor:pointer;white-space:nowrap}
#ride.off{background:var(--navy);box-shadow:0 6px 18px rgba(34,53,92,.4),inset 0 -4px 0 rgba(0,0,0,.18)}
.rrow{max-width:560px;width:100%;margin:0 auto;display:flex;align-items:center;gap:8px}
.rank{display:flex;align-items:center;gap:6px;background:var(--panel);border-radius:999px;padding:3px 10px 3px 3px;box-shadow:0 2px 8px rgba(27,39,64,.16)}
.rank .badge{font-family:var(--display);font-size:11px;color:#fff;background:var(--navy);border-radius:999px;padding:3px 8px;white-space:nowrap}
.rbar{width:70px;height:7px;border-radius:4px;background:#d5dfe9;overflow:hidden}
.rbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--kin),var(--shu))}
.medal{width:104px;height:104px;margin:0 auto;border-radius:50%;display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:17px;line-height:1.25;color:#fff;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2),0 6px 18px rgba(0,0,0,.18);-webkit-text-stroke:.5px rgba(0,0,0,.25)}
.medal.r0{background:radial-gradient(circle at 35% 30%,#c9a27a,#7a4f2a)}
.medal.r1{background:radial-gradient(circle at 35% 30%,#ebbd8e,#9c5e28)}
.medal.r2{background:radial-gradient(circle at 35% 30%,#ffffff,#8c97a8);color:#22355c}
.medal.r3{background:radial-gradient(circle at 35% 30%,#fff3b0,#d19a12);color:#5a3a00}
.medal.shake{animation:shk .7s ease-in-out}
@keyframes shk{0%,100%{transform:rotate(0)}20%{transform:rotate(-12deg) scale(1.05)}40%{transform:rotate(10deg)}60%{transform:rotate(-8deg) scale(1.08)}80%{transform:rotate(6deg)}}
.eqgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.eqi{border-radius:12px;padding:8px 10px;background:#f2f5f9;font-size:12px;line-height:1.4}
.eqi b{display:block;font-family:var(--display);font-weight:400;font-size:13px}
.eqi.r1{background:#f6e3cf}.eqi.r2{background:#e6ebf2}.eqi.r3{background:#fff1c2}
.prog{height:10px;border-radius:5px;background:#e3e9f0;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--kin),var(--shu))}
.qq{margin:0;font-weight:700;font-size:16px;line-height:1.7}
.qq rt,.qbtn rt,.qex rt{font-size:.55em}
.qc{display:flex;flex-direction:column;gap:8px}
.qbtn{border:2px solid #dbe3ec;background:#f7f9fc;border-radius:12px;padding:11px 12px;font:inherit;font-weight:700;font-size:15px;text-align:left;color:var(--ink);cursor:pointer;line-height:1.5}
.qbtn:disabled{cursor:default}
.qbtn.ok{background:#dcf5e7;border-color:var(--ok)} .qbtn.ng{background:#fde3dd;border-color:var(--shu)}
.qex{background:#f2f5f9;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.65}
.qex .note{display:block;margin-top:6px;text-align:left}
.qres{font-family:var(--display);font-size:22px;text-align:center}
.qres.ok{color:var(--ok)} .qres.ng{color:var(--shu)}
.shbar{position:relative;height:46px;border-radius:12px;background:#e3e9f0;overflow:hidden;cursor:pointer}
.shzone{position:absolute;top:0;bottom:0;background:rgba(47,168,107,.45);border-left:3px solid var(--ok);border-right:3px solid var(--ok)}
.shpin{position:absolute;top:-4px;bottom:-4px;width:6px;margin-left:-3px;background:var(--shu);border-radius:3px;box-shadow:0 0 0 2px #fff}
.shlog{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;min-height:26px}
.shlog span{font-family:var(--display);font-size:12px;border-radius:999px;padding:3px 9px;color:#fff;background:var(--navy)}
.shlog span.p{background:var(--kin);color:#4a3306}.shlog span.m{background:#9aa3b2}
.shstep{font-family:var(--display);font-size:24px;text-align:center;color:var(--navy);margin:0}
#zoom{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:8px}
#zoom button{width:44px;height:44px;border-radius:50%;border:0;background:var(--panel);font-family:var(--display);font-size:22px;line-height:1;color:var(--ink);box-shadow:0 2px 8px rgba(27,39,64,.2);cursor:pointer}
#zoom button:disabled{opacity:.4;cursor:default}
#zoom button:focus-visible{outline:3px solid var(--kin);outline-offset:2px}
.warn{background:#fff4e0;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.55}
.warn b{color:var(--shu)}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);transform:translateX(-50%);background:rgba(27,39,64,.84);color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;pointer-events:none;white-space:nowrap;z-index:5}
#pop{opacity:0;position:fixed;left:0;right:0;top:38%;z-index:7;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-inline:16px;text-align:center}
#pop h3{margin:0;font-family:var(--display);font-weight:400;font-size:34px;color:#fff;-webkit-text-stroke:2px var(--shu);paint-order:stroke fill;text-shadow:0 4px 0 var(--shu),0 8px 18px rgba(0,0,0,.25)}
#pop p{margin:0;background:rgba(27,39,64,.86);color:#fff;font-weight:700;border-radius:999px;padding:6px 14px;font-size:14px}
#pop.show{animation:pop 1.9s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.12)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 104px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:6;padding-inline:16px}
.toast{background:#fff;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;box-shadow:0 4px 14px rgba(27,39,64,.2);border-left:4px solid var(--kin);animation:tin .25s ease-out;max-width:520px}
.toast.ok{border-left-color:var(--ok)} .toast.ng{border-left-color:var(--shu)}
@keyframes tin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.modal{position:fixed;inset:0;z-index:10;background:rgba(20,30,50,.55);display:grid;place-items:center;padding:24px 16px}
.box{touch-action:pan-y;width:100%;max-width:400px;background:#fff;border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
.box h2{margin:0;font-family:var(--display);font-weight:400;font-size:30px;color:var(--shu);text-align:center;line-height:1.2}
.box p{margin:0;line-height:1.6}
.box .lead{text-align:center;font-weight:700}
.loop{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.loop li{display:flex;gap:10px;align-items:center;background:#f2f5f9;border-radius:12px;padding:8px 10px;line-height:1.45}
.loop .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:14px}
.btn{border:0;border-radius:14px;background:var(--shu);color:#fff;font-family:var(--display);font-size:20px;min-height:56px;padding:0 18px;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.btn.sub{background:#eef2f7;color:var(--ink);font-family:var(--body);font-weight:700;font-size:15px;min-height:46px;box-shadow:none}
.btn:focus-visible,.rbtn:focus-visible,#ride:focus-visible{outline:3px solid var(--kin);outline-offset:2px}
.fb{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;background:var(--kin);color:#4a3306;font-family:var(--display);font-size:17px;text-decoration:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.fb:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.note{font-size:12px;color:var(--mute);text-align:center}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<canvas id="cv" aria-label="ゲーム画面。分団の町を上から見た様子"></canvas>
<div id="hud">
  <div class="row">
    <div class="pill coin" id="pCoin"><span class="ic coin"></span><b id="hCoin">0</b></div>
    <div class="pill" id="pBag"><span class="ic bag"></span><b id="hBag">0/10</b></div>
    <div class="hearts" id="hHeart" aria-label="体力"></div>
    <span class="grow"></span>
    <button class="rbtn" id="muteBtn" aria-label="音のオンオフ">音 ON</button>
    <button class="rbtn" id="menuBtn">MENU</button>
  </div>
  <div class="rrow"><div class="rank"><span class="badge" id="hRank">団員</span><span class="rbar"><i id="hRankBar"></i></span></div></div>
  <div id="goal"><span class="tag" id="goalTag">目標</span><p id="goalText"></p></div>
</div>
<div id="zoom"><button id="zIn" aria-label="ズームイン">＋</button><button id="zOut" aria-label="ズームアウト">－</button></div>
<button id="ride" hidden>ポンプ車に乗る</button>
<div id="hint">指でなぞると歩くよ</div>
<div id="pop"><h3 id="popH"></h3><p id="popP"></p></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>

<script>
/* ===================== 設定 ===================== */
const KEY='bundan-survival-v3';
const RAD=[0,390,540,700,880,1060];
const CAPS=[0,10,20,35,55,80];
const MULT=[0,1,1.5,2,3];
const UP={
  axe:{name:'斧',icon:'axe',cost:[null,5,20,60,150,400],fx:l=>`木を切るのが速くなった！ 1本で木材${1+l}個`},
  bag:{name:'リュック',icon:'bag',cost:[null,8,25,70,180],fx:l=>`背中に${CAPS[l]}個まで持てる！`},
  hose:{name:'ホース',icon:'hose',cost:[null,10,30,80,200,500],fx:l=>'放水が強く、遠くまで届く！'},
  truck:{name:'ポンプ車',icon:'truck',cost:[30,100,260,650],fx:l=>l===1?'自動で火事とヒノコを消しに行く！ 近くで「乗る」もできる':'ポンプ車がパワーアップ！'},
  yagura:{name:'火の見やぐら',icon:'tower',cost:[null,50,150,400,1000],fx:l=>'町が広がった！ 木もヒノコも増える'},
  price:{name:'買取アップ',icon:'price',cost:[null,30,90,250],fx:l=>`売ったときのコインが${MULT[l]}倍！`},
  levee:{name:'堤防',icon:'levee',cost:[60,160,380],fx:l=>`堤防が${l}段高くなった！ 土嚢が少なくても町を守れる`},
  rail:{name:'トロッコ',icon:'cart',cost:[80,220,520],fx:l=>`${['','南','西','東'][l]}の森にトロッコ駅ができた！ 木を置くと自動で売ってくれる`},
  box:{name:'装備箱',icon:'chest',fx:()=>''},
  d_mt:{name:'山の地区',icon:'mt',cost:[800],fx:()=>'森がたくさん！ ときどき林野火災が起きる'},
  d_res:{name:'住宅街',icon:'town',cost:[1200],fx:()=>'家がたくさん！ ときどき地震が起きる'},
  soho:{name:'操法大会',icon:'hose'},
  amb:{name:'救急車',icon:'amb',cost:[150],fx:()=>'救急出動でクイズのヒントが使える。救命のごほうびも1.5倍'},
  tank:{name:'水槽車',icon:'tank',cost:[250],fx:()=>'ポンプ車についていって、放水パワーが2倍になる'},
  ladder:{name:'はしご車',icon:'ladder',cost:[400],fx:()=>'屋根やがれきに取り残された人を、自動で助けに行く'},
  crew:{name:'団員',icon:'crew',fx:()=>'木を切って売ってくれる。コインは買取所の横にたまる'},
};
const PADS=[
  {id:'sell',x:0,y:80},
  {id:'axe',x:-250,y:84,unlock:()=>S.f.sold},
  {id:'hose',x:-160,y:84,unlock:()=>S.f.mon},
  {id:'bag',x:-205,y:164,unlock:()=>S.lv.axe>=2},
  {id:'crew',x:108,y:168,unlock:()=>S.earned>=22},
  {id:'truck',x:212,y:90,unlock:()=>S.earned>=30||S.f.ext},
  {id:'yagura',x:100,y:-118,unlock:()=>S.lv.truck>=1},
  {id:'price',x:-98,y:168,unlock:()=>S.lv.yagura>=2},
  {id:'levee',x:-290,y:-150,unlock:()=>(S.tyN||0)>=1},
  {id:'amb',x:318,y:62,unlock:()=>!!S.f.emerg},
  {id:'tank',x:318,y:-28,unlock:()=>(S.rank||0)>=1},
  {id:'ladder',x:318,y:-118,unlock:()=>(S.rank||0)>=2},
  {id:'d_mt',x:-1000,y:190,unlock:()=>S.lv.yagura>=5,lock:()=>(S.rank||0)<2?'部長になると開ける':null},
  {id:'d_res',x:1000,y:190,unlock:()=>S.lv.yagura>=5,lock:()=>(S.rank||0)<3?'副分団長になると開ける':null},
  {id:'soho',x:-95,y:-95,unlock:()=>(S.rank||0)>=1},
  {id:'box',x:-300,y:168,unlock:()=>S.lv.yagura>=2||(S.rank||0)>=1},
  {id:'rail',get x(){return RAILS[Math.min(S.lv.rail||0,2)].pad.x},get y(){return RAILS[Math.min(S.lv.rail||0,2)].pad.y},unlock:()=>(S.lv.rail||0)<3&&S.lv.yagura>=RAILS[Math.min(S.lv.rail||0,2)].need},
];
const PADMAP=Object.fromEntries(PADS.map(p=>[p.id,p]));
const BLD=[
  {id:'tsume',x:0,y:-6,w:132,h:70,ht:40},
  {id:'shop',x:-205,y:-2,w:124,h:64,ht:32},
  {id:'garage',x:212,y:-8,w:120,h:62,ht:36},
  {id:'tower',x:0,y:-128,w:52,h:30,ht:0},
];
const PILE={x:78,y:112}, PARK={x:212,y:52}, START={x:0,y:210};
const ROOFS=['#6f86ad','#9b6b4f','#5f7d6a','#b0715f','#8a7aa8','#4f7f94'];

/* ===================== 状態 ===================== */
let S;
function fresh(){return{v:3,started:false,coins:0,frac:0,wood:0,stone:0,lv:{axe:1,bag:1,hose:1,truck:0,yagura:1,price:1,levee:0,rail:0,amb:0,tank:0,ladder:0,d_mt:0,d_res:0},crew:0,paid:{},f:{},earned:0,pile:0,seen:['sell'],muted:false,uz:.8,px:null,py:null,sand:0,tyN:0,tyT:null,merit:0,rank:0,eq:{helmet:0,coat:0,boots:0,nozzle:0},boxN:0,boxes:0,rs:[{w:0,s:0},{w:0,s:0},{w:0,s:0}]}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.v===3?s:null}catch(e){return null}}
function save(){if(S){if(!P.ride){S.px=Math.round(P.x);S.py=Math.round(P.y)}}try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){return false}}

const radius=()=>RAD[S.lv.yagura];
const cap=()=>CAPS[S.lv.bag];
const carry=()=>S.wood+S.stone;
const chopInt=()=>.32*Math.pow(.75,S.lv.axe-1);
const woodPer=()=>1+S.lv.axe;
const hosePow=()=>4*Math.pow(1.6,S.lv.hose-1)*(1+[0,.15,.3,.5][S.eq.coat]);
const hoseRange=()=>86+12*S.lv.hose+[0,10,20,35][S.eq.nozzle];
const maxHp=()=>5+S.eq.helmet;
const spdMul=()=>1+[0,.08,.15,.25][S.eq.boots];
const truckPow=()=>10*Math.pow(1.7,S.lv.truck-1)*(S.lv.tank?2:1);
const truckRange=()=>150+20*S.lv.truck;
const truckSpeed=()=>150+25*S.lv.truck;
const crewMax=()=>1+2*S.lv.yagura;
const crewCost=()=>Math.round(15*Math.pow(1.6,S.crew));
const yl=()=>S.lv.yagura;
function padCost(id){if(id==='soho')return null;if(id==='box')return Math.min(500,60+30*(S.boxN||0));if(id==='crew')return S.crew<crewMax()?crewCost():null;const c=UP[id].cost[S.lv[id]];return c==null?null:c}
function padRem(id){const c=padCost(id);return c==null?null:c-(S.paid[id]||0)}
const unlocked=p=>!p.unlock||p.unlock();

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const DIST=[{id:'d_mt',name:'山の地区',x:-1450,y:120,r:520},{id:'d_res',name:'住宅街',x:1450,y:120,r:520}];
const openD=()=>DIST.filter(d=>S.lv[d.id]);
function inArea(x,y,m){if(Math.hypot(x,y)<radius()-m)return true;for(const d of openD())if(dist(x,y,d.x,d.y)<d.r-m)return true;return false}
const active=o=>inArea(o.x,o.y,18);
function blocked(x,y){for(const b of BLD){if(Math.abs(x-b.x)<b.w/2+8&&y>b.y-b.h/2-4&&y<b.y+b.h/2+10)return true}return false}
const riverY=x=>-310+16*Math.sin(x/190);
const inRiver=(x,y)=>Math.abs(y-riverY(x))<28;
const onBridge=(x,y)=>Math.abs(x)<24&&inRiver(x,y);
const DEPOT={x:-150,y:-150};
const RIVER_HOUSES=[[-215,-210],[-62,-196],[72,-196],[162,-192],[255,-188]];
function genWorld(){
  const r=mulberry(4242);trees=[];houses=[];
  [[-48,282],[82,292],[-8,342],[100,368],[-82,350],[-30,420]].forEach(p=>trees.push(mkTree(p[0],p[1])));
  for(let gx=-1100;gx<=1100;gx+=92)for(let gy=-1100;gy<=1100;gy+=92){
    const x=gx+(r()-.5)*46,y=gy+(r()-.5)*46,d=Math.hypot(x,y);if(d>1070)continue;
    if(Math.abs(x)<330&&y>-235&&y<255)continue;
    if(Math.abs(x)<140&&y>=255&&y<440)continue;
    if(Math.abs(y-riverY(x))<62)continue;
    if((Math.abs(x-40)<34&&y>100&&y<540)||(Math.abs(y-140)<40&&Math.abs(x)<540))continue;
    const v=r();
    if(v<.44)trees.push(mkTree(x,y));
    else if(v<.62)houses.push({x,y,w:42+r()*14,h:34+r()*8,ht:20,roof:ROOFS[Math.floor(r()*ROOFS.length)],st:'ok',hp:0,burn:0,t:0,sm:0});
  }
  const r2=mulberry(777);
  for(let gx=-1960;gx<=-940;gx+=70)for(let gy=-420;gy<=660;gy+=70){const x=gx+(r2()-.5)*36,y=gy+(r2()-.5)*36;
    if(dist(x,y,-1450,120)>500||Math.hypot(x,y)<1090||Math.abs(y-140)<44||Math.abs(y-riverY(x))<62)continue;const v=r2();
    if(v<.64){const t=mkTree(x,y);t.mt=true;trees.push(t)}else if(v<.69)houses.push({x,y,w:40,h:32,ht:18,roof:'#7a5a3a',st:'ok',hp:0,burn:0,t:0,sm:0})}
  for(let gx=940;gx<=1960;gx+=94)for(let gy=-420;gy<=660;gy+=94){const x=gx+(r2()-.5)*40,y=gy+(r2()-.5)*40;
    if(dist(x,y,1450,120)>500||Math.hypot(x,y)<1090||Math.abs(y-140)<46||Math.abs(y-riverY(x))<62)continue;const v=r2();
    if(v<.58)houses.push({x,y,w:44+r2()*14,h:34+r2()*8,ht:20,roof:ROOFS[Math.floor(r2()*ROOFS.length)],st:'ok',hp:0,burn:0,t:0,sm:0,res:true});else if(v<.7)trees.push(mkTree(x,y))}
  RIVER_HOUSES.forEach(([x,y],i)=>houses.push({x,y,w:46+(i%3)*5,h:36,ht:20,roof:ROOFS[i%ROOFS.length],st:'ok',hp:0,burn:0,t:0,sm:0}));
}

function tone(f,d,type,g,slide,delay){if(!AC||S.muted)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),a=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);a.gain.setValueAtTime(g||.06,t);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
let combo=0,comboT=0;
function snd(k){if(!AC||S.muted)return;const now=performance.now();if(lastS[k]&&now-lastS[k]<45)return;lastS[k]=now;
  if(k==='chop')tone(200,.09,'triangle',.1,80);
  else if(k==='pick'){combo=Math.min(combo+1,16);comboT=.6;tone(520+combo*45,.07,'sine',.07)}
  else if(k==='coin'){combo=Math.min(combo+1,16);comboT=.6;tone(900+combo*30,.05,'square',.03);tone(1300+combo*30,.07,'square',.025,null,.04)}
  else if(k==='buy'){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'square',.05,null,i*.08))}
  else if(k==='hurt')tone(220,.22,'sawtooth',.07,70);
  else if(k==='kill'){tone(700,.12,'triangle',.08,1400);tone(300,.15,'sine',.06,120,.03)}
  else if(k==='boss'){tone(110,.5,'sawtooth',.08,70);tone(110,.5,'sawtooth',.08,70,.55)}
  else if(k==='tick')tone(1500,.03,'square',.02);

  S.paid[id]=0;const p=PADMAP[id];burst(p.x,p.y,'#f3b648',34);snd('buy');buzz(40);shake=6;

function addWorker(x,y){workers.push({x,y,st:'seek',tg:null,wood:0,t:0,face:1})}
function updWorker(w,dt){
  const sp=95,sell=PADMAP.sell;
  const move=(tx,ty,r)=>{const d=dist(w.x,w.y,tx,ty);if(d<(r||22))return true;w.x+=(tx-w.x)/d*sp*dt;w.y+=(ty-w.y)/d*sp*dt;w.face=tx>w.x?1:-1;return false};
  if(w.st==='seek'){
    if(!w.tg||w.tg.st!=='up'){let b=null,bd=1e9;for(const tr of trees){if(tr.st!=='up'||tr.fire||!active(tr))continue;const taken=workers.some(o=>o!==w&&o.tg===tr);const d=dist(w.x,w.y,tr.x,tr.y)+(taken?400:0);if(d<bd){bd=d;b=tr}}w.tg=b}
    if(!w.tg)return;if(move(w.tg.x,w.tg.y+6,24)){w.st='chop';w.t=0}
  }else if(w.st==='chop'){
    w.t+=dt;if(w.t>.9){w.t=0;const tr=w.tg;if(tr&&tr.st==='up'){tr.hp--;tr.shake=.15;chips(tr.x,tr.y-14);if(tr.hp<=0){tr.st='stump';tr.t=20;w.wood+=2}}
      if(!tr||tr.st!=='up')w.st=w.wood>=6?'ret':'seek'}
  }else{
    if(!w.dep)w.dep=nearestDeposit(w.x,w.y);const dp=w.dep;
    if(move(dp.x,dp.y,26)){if(dp.line!=null){S.rs[dp.line].w+=w.wood;float(dp.x,dp.y-30,'+'+w.wood,'#d9a46e',12)}else{const v=w.wood*MULT[S.lv.price];S.pile+=v;S.earned+=v;float(PILE.x,PILE.y-20,'+'+Math.floor(v),'#f3b648',13)}w.wood=0;w.dep=null;w.st='seek'}
  }

function nearest(list,x,y,ok){let b=null,bd=1e9;for(const o of list){if(ok&&!ok(o))continue;const d=dist(x,y,o.x,o.y);if(d<bd){bd=d;b=o}}return b}
let guide={t:'',tg:null,mode:''};
function cheapestPad(afford){let b=null,bc=1e9;for(const p of PADS){if(p.id==='sell'||!unlocked(p)||(p.lock&&p.lock()))continue;const r=padRem(p.id);if(r==null)continue;if(afford&&r>S.coins)continue;if(r<bc){bc=r;b=p}}return b}
function updGuide(){
  const tree=nearest(trees,P.x,P.y,o=>o.st==='up'&&active(o));
  const fire=nearest(houses,P.x,P.y,o=>o.st==='fire'&&active(o));
  const boss=mons.find(m=>m.boss);
  const mon=nearest(mons,P.x,P.y,m=>!m.boss);
  const sell=PADMAP.sell;let g;
  if(!S.f.chopped)g={t:'木に近づこう。自動で木を切って木材がもらえる',tg:tree};
  else if(!S.f.sold)g=carry()>0?{t:'木材を詰所の「買取所」の丸に運ぶとコインになる',tg:sell}:{t:'木に近づいて木材を集めよう',tg:tree};
  else if(eq&&eq.hs.some(h=>h.person)){const h=nearest(eq.hs,P.x,P.y,o=>o.person);g={t:`地震！ 倒れた家のそばに立って、取り残された人を助けよう（あと${Math.ceil(eq.t)}秒）`,tg:h,mode:'alert'}}
  else if(trees.some(t=>t.fire)){const tr=nearest(trees,P.x,P.y,o=>o.fire);g={t:'山で林野火災！ 燃え広がる前に放水で消そう',tg:tr,mode:'alert'}}
  else if(em)g={t:`救急出動！ 倒れた人のところへ急ごう（あと${Math.ceil(em.t)}秒）`,tg:em,mode:'alert'};
  else if(cheapestPad(true)){const p=cheapestPad(true);g={t:`コインで「${padName(p.id)}」が買える！ 光っている丸に立とう`,tg:p,mode:'gold'}}
  else if(boss)g={t:'大ヒノコが来た！ ポンプ車で消そう',tg:boss,mode:'alert'};
  else if(fire)g={t:'火事だ！ 近づくと放水する。消すとお礼のコインが出る',tg:fire,mode:'alert'};
  else if(P.hp<=2&&mon&&dist(P.x,P.y,mon.x,mon.y)<200)g={t:'体力が少ない！ 少し離れると回復する',tg:sell,mode:'alert'};
  else if(mon&&(!S.f.killed||dist(P.x,P.y,mon.x,mon.y)<300))g={t:'ヒノコに近づくと放水！ 倒すと「炎の石」（高く売れる）',tg:mon,mode:'alert'};
  else if(carry()>=cap()){const dp=nearestDeposit(P.x,P.y);g={t:dp.line!=null?'背中がいっぱい！ 近くのトロッコ駅に置こう':'背中がいっぱい！ 買取所でコインにかえよう',tg:dp}}
  else if(S.pile>=5)g={t:'団員が稼いだコインを受け取ろう',tg:PILE,mode:'gold'};
  else{const p=cheapestPad(false);
    if(p){const need=padRem(p.id)-S.coins;g={t:`あと ${need} コインで「${padName(p.id)}」！ 集めて売ろう`,tg:carry()>=cap()*.7?sell:(tree||sell)}}
    else g={t:'木を切ってヒノコを倒し、町を守ろう',tg:tree}}
  const tg2=tyGuide();if(tg2)g=tg2;
  if(P.ride&&g.tg===tree)g.tg=null;
  guide=g;
  const el=document.getElementById('goal');el.className=g.mode||'';
  document.getElementById('goalTag').textContent=g.mode==='gold'?'コイン':g.mode==='alert'?'出動':'目標';
  const gt=document.getElementById('goalText');if(gt.textContent!==g.t)gt.textContent=g.t;
}

const segPad=g=>({x:g.x,y:g.y+40});

      if(dist(P.x,P.y,DEPOT.x,DEPOT.y)<40&&S.sand<cap()){S.sand++;snd('pick');bump('pBag')}

          if(g.sacks===needSacks(g)){float(g.x,g.y-34,'OK！','#2fa86b',16);snd('new')}break}}}
    if(ty.t<=0){ty.ph='storm';ty.t=26;
      for(const m of mons)m.dead=true;mons=[];

      pop('台風が来た！','雨でヒノコと火事は消えた。堤防を見守ろう');shake=6;snd('boss');buzz([60,40,60])}
  }else if(ty.ph==='storm'){

    if(el>=12&&!ty.checked){ty.checked=true;let br=0;
      for(const g of activeSegs()){if(segH(g)<ty.W){br++;zones.push({x:g.x,y:g.y+75,r:12,max:170,grow:true})}}
      shake=br?10:4;
      if(br){float(P.x,P.y-64,'堤防から水があふれた！','#ffd0c6',16);snd('hurt')}else{float(P.x,P.y-64,'土嚢が町を守った！','#fff',16);snd('buy')}}
    for(const z of zones){if(z.grow){z.r=Math.min(z.max,z.r+45*dt);if(z.r>=z.max)z.grow=false}
      for(const h of houses){if(h.st!=='ruin'&&h.st!=='flood'&&active(h)&&dist(h.x,h.y,z.x,z.y)<z.r){h.st='flood';ty.flooded.add(h)}}}
    if(ty.t<=0){ty.ph='after';ty.t=50;ty.lvl=0;
      if(zones.length){const fl=[...ty.flooded].sort(()=>Math.random()-.5);fl.slice(0,Math.min(fl.length,1+zones.length)).forEach(h=>h.person=true);
        pop('台風が去った',S.lv.truck?'屋根の上の人を助けよう。ポンプ車が水を抜く':'屋根の上の人を助けよう')}
      else endTyphoon()}
  }else if(ty.ph==='after'){
    for(let i=zones.length-1;i>=0;i--){const z=zones[i];z.r-=2.5*dt;
      if(S.lv.truck>=1&&dist(T.x,T.y,z.x,z.y)<z.r+70)z.r-=(16+8*S.lv.truck)*dt;
      if(z.r<24){zones.splice(i,1);float(z.x,z.y,'水が引いた！','#fff',14)}}
    for(const h of houses){
      if(h.person&&dist(P.x,P.y,h.x,h.y)<44)rescuePerson(h);
      if(h.st==='flood'&&!h.person&&!zones.some(z=>dist(h.x,h.y,z.x,z.y)<z.r))h.st='ok'}
    if(ty.t<=0||(!zones.length&&!houses.some(h=>h.person)))endTyphoon();
  }
}
function endTyphoon(){

  zones=[];
  const tot=ty.atRisk.length,lost=ty.atRisk.filter(h=>ty.flooded.has(h)).length,safe=tot-lost,perfect=lost===0;
  const bonus=safe*3*yl()+(perfect&&tot>0?10*yl():0);
  if(bonus)drop('coin',P.x,P.y,bonus);
  pop(perfect?'台風を完璧にのりきった！':'台風をのりきった',`守れた家 ${safe}/${tot}　${perfect?'土嚢で町を守った！':'堤防を強くすると次はもっと守れる'}`);
  snd('buy');burst(P.x,P.y-30,'#3d93db',30);addMerit(safe+(perfect?5:0));if(perfect&&tot>0)setTimeout(()=>giveBox('台風から町を守ったごほうび'),1500);

}
function tyGuide(){
  if(!ty){if(S.tyT!=null&&S.tyT<15)return{t:`天気予報：まもなく台風が来ます（${Math.ceil(S.tyT)}秒）`,tg:null,mode:'alert'};return null}
  if(ty.ph==='warn'){const sec=Math.ceil(ty.t),as=activeSegs(),ok=as.filter(g=>g.sacks>=needSacks(g)).length;
    if(ok===as.length)return{t:`準備OK！ 台風まで${sec}秒。全部の堤防に土嚢を積めた`,tg:null,mode:'gold'};
    if(S.sand===0)return{t:`台風まで${sec}秒！ 土嚢置き場で土嚢を持とう（堤防 ${ok}/${as.length}）`,tg:DEPOT,mode:'alert'};
    const g=nearest(as.filter(g=>g.sacks<needSacks(g)),P.x,P.y);return{t:`台風まで${sec}秒！ 赤く光る堤防に土嚢を積もう（${ok}/${as.length}）`,tg:segPad(g),mode:'alert'}}
  if(ty.ph==='storm')return{t:'台風が来た！ 川の水がどんどん増えている…',tg:null,mode:'alert'};
  const p=nearest(houses,P.x,P.y,h=>h.person);if(p)return{t:'屋根の上で助けを待っている人がいる！ 近づいて助けよう',tg:p,mode:'alert'};
  const z=nearest(zones,P.x,P.y);if(z)return{t:S.lv.truck?'ポンプ車が水を抜いている。もう少し！':'水が引くまで待とう',tg:z};
  return null;
}

const QZ={"kyukyu":[{"q":"倒れている人の胸を押す「<ruby>胸骨圧迫<rt>きょうこつあっぱく</rt></ruby>」。どのくらいの早さで押すのが正解？","c":["1分間に約100〜120回","1分間に約50回","1秒に3回","ゆっくり自分のペースで"],"a":0,"e":"「アンパンマンのマーチ」や「パプリカ」の曲のテンポと同じくらい、1分間に100〜120回の早さで絶え間なく押すのがポイントだよ。"},{"q":"やけどをしてしまったとき、一番最初にすることはどれ？","c":["すぐにきれいな水で冷やす","お湯で洗う","バンドエイドをはる","何もせずそのままにする"],"a":0,"e":"やけどをしたら、すぐに水道の流れる水で15分以上しっかり冷やすことが一番大切だよ。<span class=\"note\">ただし、やけどが広い<ruby>範囲<rt>はんい</rt></ruby>のときは、冷やしすぎると体が冷えて危険なんだ。まわりの大人に知らせて、すぐに119番通報しよう。</span>"},{"q":"鼻血が出たときの正しい止め方はどれ？","c":["下を向いて小鼻をしっかりつまむ","上を向いて首をトントンたたく","ティッシュをたくさん詰める","<ruby>仰向<rt>あおむ</rt></ruby>けに寝ころがる"],"a":0,"e":"上を向くと血を飲み込んで気持ち悪くなっちゃうんだ。少し下を向いて、鼻のやわらかい部分（小鼻）をしっかりつまむのが正しい止め方だよ。"},{"q":"AEDを使うとき、倒れている人の体が水や汗で濡れていたらどうする？","c":["タオルなどで胸の水分をふき取る","そのままAEDのシールを貼る","ドライヤーで乾かす","濡れている時は使わない"],"a":0,"e":"体が濡れたままだと電気がうまく伝わらないんだ。AEDに入っているタオルなどで胸の水分をふき取ってからパッド（シール）を貼ろう！"},{"q":"倒れている人を見つけたら、まずはどうやって<ruby>意識<rt>いしき</rt></ruby>があるか確かめる？","c":["肩をたたきながら声をかける","ほっぺたを強くつねる","顔に水をかける","大声で耳元で叫ぶ"],"a":0,"e":"まずは「大丈夫ですか？」と声をかけながら、両肩をトントンとたたいて反応があるか確かめよう。"},{"q":"熱中症を防ぐために、こまめに取るといいものは「水分」とあと一つは何？","c":["塩分（えんぶん）","糖分（とうぶん）","脂肪分（しぼうぶん）","鉄分（てつぶん）"],"a":0,"e":"汗をかくと水分と一緒に塩分も体から出ていってしまうんだ。お水と一緒に塩あめなどをなめて、塩分もしっかり補給しよう！"},{"q":"ごはんやおもちゃが喉に詰まって息ができなくなった人を見つけたら、背中のどこをたたく？","c":["<ruby>肩甲骨<rt>けんこうこつ</rt></ruby>（背中の羽みたいな骨）の間","腰のあたり","首のうしろ","おしり"],"a":0,"e":"肩甲骨と肩甲骨の間を、手のひらの付け根で力強く何度もたたいて（<ruby>背部叩打法<rt>はいぶこうだほう</rt></ruby>）、詰まったものを吐き出させよう。<span class=\"note\">1<ruby>歳<rt>さい</rt></ruby>より小さい赤ちゃんは、うでの上でうつぶせにして頭を低くしてから背中をたたくなど、やり方がちがうよ。まずは大人を呼んで119番通報しよう。</span>"},{"q":"AEDの電源を入れると、機械はどうなるかな？","c":["音声でやり方を教えてくれる","音楽が流れるだけ","警察に自動で電話がつながる","自分で説明書を読まないといけない"],"a":0,"e":"AEDは電源を入れると「パッドを胸に貼ってください」など、音声でやり方を全部教えてくれるから、小学生でも落ち着いて使えるんだよ。"},{"q":"救急車を呼んで待っている間、もしあれば準備しておくといいものはどれ？","c":["飲んでいるお薬や「お薬手帳」","好きなお菓子","着替えのパジャマ","暇つぶしのゲーム"],"a":0,"e":"いつも飲んでいる薬や「お薬手帳」があると、救急隊や病院の先生が正しい治療をすぐに始められるからとっても助かるんだ。"},{"q":"119番に電話をすると、消防署の人から最初に聞かれることは何かな？","c":["「火事ですか？救急ですか？」","「あなたの名前は何ですか？」","「今は何時ですか？」","「お腹は痛いですか？」"],"a":0,"e":"まずは消防車と救急車のどちらが必要かを確認するために「火事ですか？救急ですか？」と聞かれるよ。落ち着いて「救急です」と答えよう！"}],"sonae":[{"q":"グラッと<ruby>揺<rt>ゆ</rt></ruby>れを感じたら、おうちの中でまずどうする？","c":["<ruby>机<rt>つくえ</rt></ruby>の下にかくれる","外に走って<ruby>逃<rt>に</rt></ruby>げる","テレビをつける","大声で<ruby>叫<rt>さけ</rt></ruby>ぶ"],"a":0,"e":"正解！まずは自分の頭と体を守ることが一番大事だよ。<ruby>揺<rt>ゆ</rt></ruby>れがおさまるまで、机の下でダンゴムシのように丸まろう！"},{"q":"家から<ruby>逃<rt>に</rt></ruby>げるとき、<ruby>火事<rt>かじ</rt></ruby>を<ruby>防<rt>ふせ</rt></ruby>ぐために切っていくものは？","c":["ブレーカー","テレビのスイッチ","<ruby>水道<rt>すいどう</rt></ruby>の<ruby>栓<rt>せん</rt></ruby>","<ruby>冷蔵庫<rt>れいぞうこ</rt></ruby>の<ruby>電源<rt>でんげん</rt></ruby>"],"a":0,"e":"正解！電気が<ruby>復旧<rt>ふっきゅう</rt></ruby>したときに起きる「<ruby>通電火災<rt>つうでんかさい</rt></ruby>」を防ぐため、ブレーカーを落としてから逃げよう。<span class=\"note\">順番が大事。揺れている最中は身を守ることが最優先。揺れがおさまって「家を出る」と決めたときに落とすよ。揺れを感じて自動で電気を止める「感震ブレーカー」をつけておくともっと安心。</span>"},{"q":"<ruby>地震<rt>じしん</rt></ruby>のとき、外を歩いていて<ruby>危<rt>あぶ</rt></ruby>ないのはどこ？","c":["ブロック<ruby>塀<rt>べい</rt></ruby>の近く","広い公園","大きな<ruby>駐車場<rt>ちゅうしゃじょう</rt></ruby>","学校のグラウンド"],"a":0,"e":"正解！ブロック塀や<ruby>自動販売機<rt>じどうはんばいき</rt></ruby>は、揺れで倒れてくるかもしれないから、絶対に近づかないでね。"},{"q":"家族との<ruby>連絡<rt>れんらく</rt></ruby>に使う「<ruby>災害用伝言<rt>さいがいようでんごん</rt></ruby>ダイヤル」の番号は？","c":["171","119","110","104"],"a":0,"e":"正解！「イナイ（171）からかける伝言ダイヤル」と覚えてね。電話がつながりにくい時でも、家族に無事を伝えられるよ。毎月1日と15日は体験利用ができるから、家族で一度試しておこう。"},{"q":"おうちで<ruby>備蓄<rt>びちく</rt></ruby>しておくお水。1人1日あたりどれくらい必要？","c":["約3リットル","約1リットル","約500ミリリットル","約10リットル"],"a":0,"e":"正解！飲み水や料理に使う分も合わせて、1人1日3リットル。「最低3日分、できれば1週間分」が目安だよ。4人家族なら3日分で36リットル、2リットルのペットボトル18本になるね。"},{"q":"食べ物を備える「ローリングストック」ってどんな方法？","c":["<ruby>普段<rt>ふだん</rt></ruby>から食べて、食べた分を買い足す","<ruby>賞味期限<rt>しょうみきげん</rt></ruby>まで絶対に食べない","庭に<ruby>埋<rt>う</rt></ruby>めておく","<ruby>缶詰<rt>かんづめ</rt></ruby>しか買わない"],"a":0,"e":"正解！いつも食べているレトルト食品やお菓子を少し多めに買い、古いものから食べて買い足すことで、常に新しい食料を備えられるよ。"},{"q":"もしも<ruby>瓦礫<rt>がれき</rt></ruby>に<ruby>閉<rt>と</rt></ruby>じ<ruby>込<rt>こ</rt></ruby>められたら、助けを呼ぶのに一番いいアイテムは？","c":["ホイッスル（笛）","大声で叫び続ける","スマホのライト","<ruby>拍手<rt>はくしゅ</rt></ruby>をする"],"a":0,"e":"正解！大声を出し続けると体力を<ruby>消耗<rt>しょうもう</rt></ruby>しちゃうんだ。少しの息で遠くまで音が届くホイッスルをカバンにつけておこう。笛がなければ、近くの壁やパイプを硬いもので叩くのも有効だよ。"},{"q":"<ruby>寝<rt>ね</rt></ruby>ている部屋に、置かないほうがいいものはどれ？","c":["<ruby>背<rt>せ</rt></ruby>の高い家具","目覚まし時計","<ruby>懐中電灯<rt>かいちゅうでんとう</rt></ruby>","スリッパ"],"a":0,"e":"正解！寝ているときに本棚やタンスが倒れてくると逃げられなくなるよ。寝室にはなるべく大きな家具を置かず、どうしても置くなら突っ張り棒などで固定しよう。枕元にはスリッパと懐中電灯を！"},{"q":"<ruby>災害<rt>さいがい</rt></ruby>のとき、水が止まってトイレが使えなくなるかも。何を準備する？","c":["<ruby>携帯<rt>けいたい</rt></ruby>・<ruby>簡易<rt>かんい</rt></ruby>トイレ","新聞紙","たくさんのトイレットペーパー","大きなバケツ"],"a":0,"e":"正解！トイレに流せなくなるとあっという間に困ってしまうよ。便器にかぶせて使える簡易トイレを、1人1日5回×家族の人数×最低3日分を目安に用意しておこう。"},{"q":"<ruby>非常持<rt>ひじょうも</rt></ruby>ち<ruby>出<rt>だ</rt></ruby>し<ruby>袋<rt>ぶくろ</rt></ruby>の重さは、どれくらいがいい？","c":["自分が無理なく走れる重さ","30キログラム","持てるだけ全部","100グラム"],"a":0,"e":"正解！いくら荷物を詰めても、重すぎて逃げ遅れたら意味がないよ。背負ったまま走って逃げられる重さにしておこう！"}],"nyudan":[{"q":"消防団員は、ふだん何をしている人？","c":["会社員や学生など、別の仕事や学業を持つ人","消防署で24時間働くプロ","引退した元消防士だけ","市役所の職員"],"a":0,"e":"正解！消防団員は、それぞれ仕事や学業を持ちながら、火事や災害のときに出動する「地域の消防」です。消防署の職員（消防士）とは別の組織で、全国に約73万人います。"},{"q":"消防団員の身分は？","c":["非常勤の地方公務員","ボランティア（無資格）","市役所の正職員","消防署のアルバイト"],"a":0,"e":"正解！「非常勤特別職の地方公務員」として市長の承認のもと任命されます。だから報酬も出るし、活動中のケガには公務災害補償もあるんです。"},{"q":"吹田市消防団に入団できる年齢は？","c":["18歳以上","20歳以上","25歳以上","30歳以上"],"a":0,"e":"正解！条件は「吹田市に住んでいる・働いている・通学している」「18歳以上」「健康で熱意がある」の3つ。上限年齢の決まりはありません。"},{"q":"吹田市に住んでいないと入団できない？","c":["吹田市で働いていれば入団できる","住んでいないと絶対に無理","大阪府内ならどこでもOK","親が吹田市民ならOK"],"a":0,"e":"正解！他市に住んでいても、勤務先や学校が吹田市なら入団できます（機能別消防団員・勤務地団員の制度）。勤務時間中に出動することがあるので、勤め先の了承は必要です。"},{"q":"消防団員に報酬は出る？","c":["年額報酬＋出動ごとの報酬が出る","完全に無報酬のボランティア","交通費だけ出る","お弁当が出る"],"a":0,"e":"正解！吹田市では団員の年額報酬が36,500円、さらに火災出動1回4,800円〜、訓練1日3,500円などが支給されます（しおり掲載の額）。公務員の報酬なので、勤め先への届出が必要かは職場に確認してね。"},{"q":"5年以上つとめて退団すると、もらえるものは？","c":["退職報償金（団員で20万円〜）","消防車のミニカー","特になし","表彰状だけ"],"a":0,"e":"正解！5年以上つとめると、勤務年数と階級に応じて退職報償金が支給されます。団員なら5年以上で20万円、長く続けるほど増えていきます。"},{"q":"女性は消防団に入れる？","c":["入れる。火災現場にも出動する","入れるけど事務だけ","広報だけ担当","入れない"],"a":0,"e":"正解！吹田市消防団は女性も入団でき、活動内容は男性団員と同じ。火災や自然災害に出動し、ポンプ車操法大会にも出場しています。"},{"q":"大学生が消防団に入ると、就職活動で使える制度があります。その名前は？","c":["学生消防団活動認証制度","消防団インターン制度","消防推薦入社制度","そんな制度はない"],"a":0,"e":"正解！大学生・大学院生・専門学校生が吹田市消防団で1年以上活動すると、市が功績を認証する「認証状」がもらえます。エントリーシートや面接の自己PRに使えます。"},{"q":"消防団員の階級は、全部でいくつ？","c":["7つ","3つ","12つ","階級はない"],"a":0,"e":"正解！団員・班長・部長・副分団長・分団長・副団長・団長の7つ。入団するとまず「団員」からスタートです。"},{"q":"吹田市消防団は市内にいくつの分団がある？","c":["9分団","3分団","20分団","1分団"],"a":0,"e":"正解！吹一・吹二・吹三・千一・千二・豊津・岸部・山田・千里丘の9分団（＋春日班・別所班）。定員は250人。基本は住んでいる地域の分団に入りますが、希望の分団があれば相談できます。"}]};
const qQueue={};
function nextQ(bank){if(!qQueue[bank]||!qQueue[bank].length)qQueue[bank]=QZ[bank].map((_,i)=>i).sort(()=>Math.random()-.5);return QZ[bank][qQueue[bank].pop()]}
let qCur=null;
function quiz(bank,title,sub,hint,cb){
  const q=nextQ(bank),order=q.c.map((_,i)=>i).sort(()=>Math.random()-.5);qCur={q,cb,done:false,ok:false};
  modal(`<h2>${title}</h2><p class="note">${sub}</p><p class="qq">${q.q}</p><div class="qc">${order.map(i=>`<button class="qbtn" data-act="qa" data-i="${i}">${q.c[i]}</button>`).join('')}</div>${hint?'<button class="btn sub" data-act="qhint" id="qhint">救急車のヒント：まちがいを1つ消す</button>':''}<div id="qres" hidden></div>`);
}
function quizAnswer(i){if(!qCur||qCur.done)return;qCur.done=true;const q=qCur.q,ok=i===q.a;qCur.ok=ok;
  document.querySelectorAll('.qbtn').forEach(b=>{b.disabled=true;const k=+b.dataset.i;if(k===q.a)b.classList.add('ok');else if(k===i)b.classList.add('ng')});
  const h=document.getElementById('qhint');if(h)h.hidden=true;
  const r=document.getElementById('qres');r.hidden=false;r.innerHTML=`<p class="qres ${ok?'ok':'ng'}">${ok?'正解！':'ざんねん…'}</p><div class="qex">${ok?'':'正解は「'+q.c[q.a]+'」。'}${q.e}</div><button class="btn" data-act="qdone" style="margin-top:10px">つづける</button>`;
  r.scrollIntoView({block:'nearest'});snd(ok?'buy':'hurt');if(ok)buzz(30)}
function quizHint(){if(!qCur||qCur.done)return;const q=qCur.q;const wr=[...document.querySelectorAll('.qbtn')].filter(b=>+b.dataset.i!==q.a&&!b.hidden);if(wr.length>1)wr[Math.floor(Math.random()*wr.length)].hidden=true;const h=document.getElementById('qhint');if(h)h.hidden=true}
function quizDone(){const c=qCur;qCur=null;closeModal();if(c&&c.cb)c.cb(c.ok)}

let em=null,emT=40;
function updEmerg(dt){
  if(em){em.t-=dt;
    if(!P.ride&&dist(P.x,P.y,em.x,em.y)<36||P.ride&&dist(P.x,P.y,em.x,em.y)<60){const e=em;em=null;
      quiz('kyukyu','救急出動！','倒れている人を助けよう。正しい答えを選んでね',!!S.lv.amb,ok=>{
        S.f.emerg=true;S.emN=(S.emN||0)+1;
        if(ok){const c=Math.round((8+4*yl())*(S.lv.amb?1.5:1));drop('coin',e.x,e.y,c);addMerit(5);float(e.x,e.y-50,'救命成功！','#fff',18);burst(e.x,e.y-20,'#2fa86b',24)}
        else{drop('coin',e.x,e.y,2);addMerit(1);float(e.x,e.y-50,'救急隊に引き継いだ','#fff',14)}});
      return}
    if(em.t<=0){float(em.x,em.y-40,'救急隊が病院へ運んだ','#fff',13);em=null}
    return}
  if(ty||S.lv.truck<1)return;
  emT-=dt;if(emT>0)return;emT=80+Math.random()*40;
  for(let k=0;k<40;k++){const a=Math.random()*7,d=150+Math.random()*(radius()-200),x=Math.cos(a)*d,y=Math.sin(a)*d;
    if(blocked(x,y)||inRiver(x,y)||dist(x,y,P.x,P.y)<180||houses.some(h=>dist(x,y,h.x,h.y)<40)||PADS.some(p=>dist(x,y,p.x,p.y)<50))continue;
    em={x,y,t:70};snd('boss');buzz([50,50,50]);toast('救急出動！ 町で人が倒れている','ng');return}
}
function rescuePerson(h){h.person=false;if(eq&&eq.hs.includes(h))eq.saved++;if(ty)ty.rescued++;addMerit(3);drop('coin',h.x,h.y,5+2*yl());float(h.x,h.y-56,'助かった！ありがとう','#fff',14);snd('kill');burst(h.x,h.y-30,'#3d93db',12)}
const VEHS=['amb','tank','ladder'];
const VEH={amb:{x:318,y:62,face:-1,moving:false,t:0},tank:{x:318,y:-28,face:-1,moving:false,t:0},ladder:{x:318,y:-118,face:-1,moving:false,t:0}};
function driveTo(v,tx,ty2,stop,sp,dt){const d=dist(v.x,v.y,tx,ty2);v.moving=d>stop;if(v.moving){v.x+=(tx-v.x)/d*sp*dt;v.y+=(ty2-v.y)/d*sp*dt;if(Math.abs(tx-v.x)>4)v.face=tx>v.x?1:-1}return !v.moving}
function updVehicles(dt){
  const A=VEH.amb,Tk=VEH.tank,L=VEH.ladder;
  if(S.lv.amb){if(em)driveTo(A,em.x+50,em.y+10,8,200,dt);else driveTo(A,PADMAP.amb.x,PADMAP.amb.y,6,200,dt);A.lit=!!em}
  if(S.lv.tank){const out=S.lv.truck&&dist(T.x,T.y,PARK.x,PARK.y)>40;if(out)driveTo(Tk,T.x-T.face*70,T.y+6,30,truckSpeed()*1.4,dt);else driveTo(Tk,PADMAP.tank.x,PADMAP.tank.y,6,180,dt);Tk.lit=out}
  if(S.lv.ladder){const h=nearest(houses,L.x,L.y,o=>o.person);
    if(h){if(driveTo(L,h.x+40,h.y+30,10,190,dt)){L.t+=dt;if(L.t>2){L.t=0;rescuePerson(h);float(h.x,h.y-70,'はしご車で救助！','#fff',13)}}else L.t=0;L.lit=true}
    else{driveTo(L,PADMAP.ladder.x,PADMAP.ladder.y,6,190,dt);L.lit=false;L.t=0}}
}
function drawVeh(kind,v,t){const x=v.x,y=v.y,f=v.face,lit=v.lit&&Math.floor(t/150)%2;
  shadow(x,y+2,40,8);cx.save();cx.translate(x,y);cx.scale(f,1);

      if(c-(S.paid[p.id]||0)<=0)levelUp(p.id)}}

  for(const m of mons){if(m.dead)continue;m.t+=dt;m.hit=Math.max(0,m.hit-dt);
    const sp=m.boss?26:44,dp=dist(m.x,m.y,P.x,P.y);let tx,ty;
    if(!P.ride&&dp<(m.boss?230:170)){tx=P.x;ty=P.y}

    else if(h.st==='ruin'){h.t-=dt;if(h.t<=0)h.st='ok'}}

  updTyphoon(dt);updRail(dt);updEmerg(dt);updVehicles(dt);updForest(dt);updQuake(dt);updSoho(dt);

    if(p.life<=0)parts.splice(i,1)}

  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.y-=34*dt;f.life-=dt*.9;if(f.life<=0)floats.splice(i,1)}

}

    if(p.k==='conf'){cx.globalAlpha=Math.max(0,p.life);cx.fillStyle=p.c;cx.fillRect(p.x-2.5,p.y-2.5,5,5)}
    else if(p.k==='chip'){cx.globalAlpha=Math.max(0,p.life/.6);cx.fillStyle='#c79a63';cx.fillRect(p.x-2,p.y-1.5,4,3)}
    else if(p.k==='fly'){cx.globalAlpha=1;const q=p.t,x=p.sx+(p.tx-p.sx)*q,y=p.sy+(p.ty-p.sy)*q-Math.sin(q*Math.PI)*30;icon(p.item,x,y,.7)}
    else if(p.k==='drop'){const src=p.src,big=p.big,ox=src.x+src.face*(big?30:10),oy=src.y-(big?36:18),q=p.t,x=ox+(p.tx-ox)*q,y=oy+(p.ty-oy)*q-Math.sin(q*Math.PI)*45;cx.globalAlpha=.85;cx.fillStyle='#3d93db';cx.beginPath();cx.arc(x,y,big?4:2.6,0,7);cx.fill()}
    else if(p.k==='smoke'){cx.globalAlpha=Math.max(0,p.life*.45);cx.fillStyle='#6d7380';cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}}
  cx.globalAlpha=1;
  for(const f of floats){cx.globalAlpha=clamp(f.life*1.5,0,1);label(f.txt,f.x,f.y,f.size,f.col,null,'rgba(27,39,64,.85)')}
  cx.globalAlpha=1;
  drawFog();
  setScreen();drawWeather(t);
  // 目標の矢印
  const tg=guide.tg;
  if(tg){const sp=toScreen(tg.x,tg.y),mg=40,top=150,bot=H-90,col=guide.mode==='alert'?'#e5432a':guide.mode==='gold'?'#f3b648':'#ffffff';
    if(sp.x>mg&&sp.x<W-mg&&sp.y>top&&sp.y<bot){const b=Math.sin(t/170)*6,yy=sp.y-70*sc()+b;cx.fillStyle=col;cx.strokeStyle='#22355c';cx.lineWidth=2.5;cx.beginPath();cx.moveTo(sp.x,yy+16);cx.lineTo(sp.x-13,yy);cx.lineTo(sp.x-5,yy);cx.lineTo(sp.x-5,yy-14);cx.lineTo(sp.x+5,yy-14);cx.lineTo(sp.x+5,yy);cx.lineTo(sp.x+13,yy);cx.closePath();cx.fill();cx.stroke()}
    else{const ps=toScreen(P.x,P.y),ang=Math.atan2(sp.y-ps.y,sp.x-ps.x),r=Math.min(W,H)*.32;let ex=clamp(ps.x+Math.cos(ang)*r,mg,W-mg),ey=clamp(ps.y+Math.sin(ang)*r,top,bot);
      cx.save();cx.translate(ex,ey);cx.rotate(ang);const pl=1+.12*Math.sin(t/150);cx.scale(pl,pl);cx.fillStyle=col;cx.strokeStyle='#22355c';cx.lineWidth=2.5;cx.beginPath();cx.moveTo(22,0);cx.lineTo(-12,-16);cx.lineTo(-5,0);cx.lineTo(-12,16);cx.closePath();cx.fill();cx.stroke();cx.restore()}}
  if(em&&em!==tg){const sp=toScreen(em.x,em.y);if(!(sp.x>0&&sp.x<W&&sp.y>140&&sp.y<H)){const ex=clamp(sp.x,26,W-26),ey=clamp(sp.y,160,H-40);cx.fillStyle='#e5432a';cx.beginPath();cx.arc(ex,ey,15,0,7);cx.fill();label('救',ex,ey+1,13,'#fff')}}
  for(const tr of trees){if(!tr.fire||tr===tg)continue;const sp=toScreen(tr.x,tr.y);if(sp.x>0&&sp.x<W&&sp.y>140&&sp.y<H)continue;const ex=clamp(sp.x,26,W-26),ey=clamp(sp.y,160,H-40);cx.fillStyle='#e5432a';cx.beginPath();cx.arc(ex,ey,14,0,7);cx.fill();label('林',ex,ey+1,12,'#fff');break}
  for(const h of houses){if(h.st!=='fire'||h===tg||!active(h))continue;const sp=toScreen(h.x,h.y);if(sp.x>0&&sp.x<W&&sp.y>140&&sp.y<H)continue;const ex=clamp(sp.x,26,W-26),ey=clamp(sp.y,160,H-40);cx.fillStyle='#e5432a';cx.beginPath();cx.arc(ex,ey,14,0,7);cx.fill();label('火',ex,ey+1,13,'#fff')}
  if(joy){cx.fillStyle='rgba(27,39,64,.12)';cx.strokeStyle='rgba(27,39,64,.3)';cx.lineWidth=2;cx.beginPath();cx.arc(joy.ox,joy.oy,52,0,7);cx.fill();cx.stroke();cx.fillStyle='rgba(229,67,42,.85)';cx.beginPath();cx.arc(joy.ox+joy.dx,joy.oy+joy.dy,22,0,7);cx.fill()}
}

/* ===================== HUD ===================== */
let hudKey='';
function hud(){
  const k=[S.coins,carry(),cap(),P.hp,S.muted,S.sand,maxHp(),S.rank,S.merit].join(',');if(k!==hudKey){hudKey=k;
    document.getElementById('hCoin').textContent=S.coins;
    document.getElementById('hRank').textContent=RANKS[S.rank];document.getElementById('hRankBar').style.width=(rankProg()*100)+'%';
    document.getElementById('hBag').textContent=S.sand>0?`${S.sand}/${cap()}`:`${carry()}/${cap()}`;document.getElementById('pBag').classList.toggle('sand',S.sand>0);
    document.getElementById('pBag').classList.toggle('full',carry()>=cap());
    document.getElementById('hHeart').innerHTML=Array.from({length:maxHp()},(_,i)=>`<i class="${i<P.hp?'':'off'}"></i>`).join('');
    document.getElementById('muteBtn').textContent=S.muted?'音 OFF':'音 ON'}
  const rb=document.getElementById('ride');const show=S.lv.truck>=1&&(P.ride||dist(P.x,P.y,T.x,T.y)<80);
  rb.hidden=!show;if(show){const tx=P.ride?'ポンプ車から降りる':'ポンプ車に乗る';if(rb.textContent!==tx)rb.textContent=tx;rb.classList.toggle('off',P.ride)}
  document.getElementById('hint').hidden=moved||show;
}
document.getElementById('ride').addEventListener('click',()=>{audio();
  if(P.ride){P.ride=false;let x=T.x,y=T.y+34;if(blocked(x,y)){x=T.x;y=T.y}P.x=x;P.y=y;toast('ポンプ車は自動で火を消しに行きます')}
  else{P.ride=true;P.x=T.x;P.y=T.y;toast('ポンプ車で走ろう！ 近くの火とヒノコに自動で放水','ok')}
  snd('new')});
document.getElementById('muteBtn').addEventListener('click',()=>{audio();S.muted=!S.muted;save()});

/* ===================== モーダル ===================== */
let paused=false;
function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="box">${html}</div></div>`;paused=true}
function closeModal(){document.getElementById('modalRoot').innerHTML='';paused=false;last=performance.now();if(S&&S.boxes)setTimeout(tryOpenBox,350)}
const INAPP=/Line\/|Instagram|FBAN|FBAV|FB_IAB|Twitter|MicroMessenger|GSA\//i.test(navigator.userAgent);
const WARN=INAPP?`<div class="warn"><b>アプリの中で開いています。</b>画面が動いてしまうときは、右上や右下のメニューから「ブラウザで開く（Safariで開く）」を選ぶと快適に遊べます。</div>`:'';
const LOOP=`<ul class="loop">
<li><span class="n">1</span><span>木に近づく → 自動で切って<b>木材</b>ゲット</span></li>
<li><span class="n">2</span><span>ヒノコに近づく → 放水で倒して<b>炎の石</b>ゲット</span></li>
<li><span class="n">3</span><span>詰所の<b>買取所</b>に運ぶ → <b>コイン</b>に変わる</span></li>
<li><span class="n">4</span><span>光る丸に立つ → コインで<b>斧・ホース・ポンプ車</b>を買って強くなる</span></li>
<li><span class="n">5</span><span><b>救急出動</b>！ 倒れた人のところへ行って、クイズに答えて助けよう</span></li>
<li><span class="n">6</span><span>班長になると<b>操法大会</b>に出場できる。部長からは<b>新しい地区</b>も開ける</span></li>
<li><span class="n">7</span><span><b>台風</b>が来る前に、川の堤防に<b>土嚢</b>を積んで町を守ろう</span></li>
</ul>`;
function intro(){modal(`<h2>分団サバイバル</h2><p class="lead">消防団になって、町を火事から守ろう！</p>${LOOP}${WARN}<button class="btn" data-act="start">スタート</button><p class="note">画面のどこでも、指でなぞると歩きます<br>遊んだら MENU の「感想を送る」から感想を教えてね</p>`)}
function cont(){modal(`<h2>おかえり！</h2><p class="lead">前回のつづきから遊べます</p><p class="note">コイン ${S.coins}枚・やぐら Lv${S.lv.yagura}・団員 ${S.crew}人</p>${WARN}<button class="btn" data-act="close">つづきから</button><button class="btn sub" data-act="reset">はじめから</button>`)}
function eqHtml(){return `<div class="eqgrid">${Object.keys(EQ).map(k=>`<div class="eqi r${S.eq[k]}"><b>${EQ[k].name}：${RARE[S.eq[k]]}</b>${EQ[k].fx[S.eq[k]]||'まだ持っていない'}</div>`).join('')}</div>`}
function rankHtml(){const nx=S.rank<6?`次の「${RANKS[S.rank+1]}」まで 功績あと${RANK_REQ[S.rank+1]-S.merit}`:'最高の階級！';return `<p class="lead">階級：${RANKS[S.rank]}（功績 ${S.merit}）</p><div class="prog"><i style="width:${rankProg()*100}%"></i></div><p class="note">${nx}<br>火を消す・ヒノコを倒す・人を助ける・台風から町を守ると功績がたまる</p>`}
function menu(){modal(`<h2>メニュー</h2>${rankHtml()}${eqHtml()}${LOOP}<button class="btn" data-act="close">ゲームにもどる</button><button class="btn sub" data-act="savequit">セーブしてやめる</button><a class="fb" href="https://forms.gle/12nXo4Chy7ChWuWP6" target="_blank" rel="noopener">感想を送る（1分）</a><button class="btn sub" data-act="reset">次の人のために最初からにする</button>`)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;audio();
  if(a==='start'){S.started=true;save();closeModal()}
  else if(a==='close')closeModal();
  else if(a==='qa')quizAnswer(+b.dataset.i);
  else if(a==='shgo')sohoStart();
  else if(a==='shtap')sohoTap();
  else if(a==='qhint')quizHint();
  else if(a==='qdone')quizDone();
  else if(a==='savequit'){const ok=save();modal(ok?`<h2>セーブしました</h2><p class="lead">このまま閉じてOK。次に開くと、つづきから遊べます。</p><p class="note">同じスマホ・同じブラウザで開いてね</p><button class="btn" data-act="close">ゲームにもどる</button>`:`<h2>セーブできません</h2><p>このブラウザではセーブが使えない設定になっています。Safariで開くとセーブできます。</p><button class="btn" data-act="close">ゲームにもどる</button>`)}
  else if(a==='reset'){if(b.dataset.arm){const uz=S.uz,mu=S.muted;S=fresh();S.uz=uz;S.muted=mu;S.started=true;resetWorld();save();closeModal();pop('スタート！','木に近づいてみよう')}else{b.dataset.arm='1';b.textContent='もう一度押すとリセット'}}});
document.getElementById('menuBtn').addEventListener('click',()=>{audio();menu()});

/* ===================== ループ ===================== */
let last=performance.now();
function resetWorld(){genWorld();ty=null;em=null;emT=40;eq=null;ff=false;ffT=80;eqT=110;sh=null;for(const k of VEHS){VEH[k].x=PADMAP[k].x;VEH[k].y=PADMAP[k].y}zones=[];for(const g of segs)g.sacks=0;mons=[];drops=[];workers=[];parts=[];floats=[];P.x=START.x;P.y=START.y;if(S.px!=null&&!blocked(S.px,S.py)&&Math.hypot(S.px,S.py)<radius()-20){P.x=S.px;P.y=S.py}P.hp=maxHp();P.ride=false;T.x=PARK.x;T.y=PARK.y;cam.x=P.x;cam.y=P.y;monT=3;bossT=90;
  for(let i=0;i<S.crew;i++)addWorker(PADMAP.crew.x+(i%3)*12,PADMAP.crew.y);moved=false}
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(!paused&&!document.hidden)update(dt);
  zoom+=((P.ride?.85:1)-zoom)*Math.min(1,dt*3);
  cam.x+=(P.x-cam.x)*Math.min(1,dt*6);cam.y+=(P.y-cam.y)*Math.min(1,dt*6);
  updGuide();hud();draw(t);requestAnimationFrame(loop);
}
function boot(data){
  S=(data&&data.S)||load()||fresh();
  S.seen=S.seen||['sell'];if(S.lv.levee==null)S.lv.levee=0;if(S.lv.rail==null)S.lv.rail=0;for(const k of ['amb','tank','ladder','d_mt','d_res'])if(S.lv[k]==null)S.lv[k]=0;if(S.sohoCD==null)S.sohoCD=0;if(S.merit==null)S.merit=0;if(S.rank==null)S.rank=0;if(!S.eq)S.eq={helmet:0,coat:0,boots:0,nozzle:0};if(S.boxN==null)S.boxN=0;if(S.boxes==null)S.boxes=0;if(!S.rs)S.rs=[{w:0,s:0},{w:0,s:0},{w:0,s:0}];if(S.tyN==null)S.tyN=0;if(S.tyT===undefined)S.tyT=null;S.sand=0;if(!S.uz)S.uz=.8;setZoom(S.uz);
  resize();addEventListener('resize',resize);resetWorld();
  if(!S.started)intro();else if(S.earned>0)cont();
  setInterval(save,3000);addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();last=performance.now()});
  requestAnimationFrame(t=>{last=t;loop(t)});
}
if(window.claude&&window.claude.hot&&typeof window.claude.hot.snapshot==='function')window.claude.hot.snapshot(()=>({S}));
(window.claude&&window.claude.hot&&window.claude.hot.ready)?window.claude.hot.ready(boot):boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>
