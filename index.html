<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#22355c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="消防団になって町を火事から守ろう。吹田市消防団のアクション育成ゲーム">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>分団サバイバル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
</head>
<body>
<style>
/* Layout: full-screen action canvas (snowy town from above). HUD pinned top: coins / backpack / hearts, goal banner under it. Ride button bottom-center. Single committed daylight-snow look. */
:root{
  --ink:#1b2740; --navy:#22355c; --shu:#e5432a; --kin:#f3b648; --kin-d:#c8901f; --snow:#e9eff4;
  --wood:#b07a46; --mute:#5d6b84; --panel:rgba(255,255,255,.94); --ok:#2fa86b;
  --display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color-scheme:light;
}
html,body{height:100%;overflow:hidden;background:var(--snow);color:var(--ink);overscroll-behavior:none;touch-action:none}
body{position:fixed;inset:0}
body{font-family:var(--body);font-size:14px;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
*{box-sizing:border-box}
#cv{position:fixed;inset:0;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 0;pointer-events:none;display:flex;flex-direction:column;gap:7px;z-index:5}
.row{display:flex;gap:6px;align-items:center;max-width:560px;width:100%;margin:0 auto}
.pill{display:flex;align-items:center;gap:5px;background:var(--panel);border-radius:999px;padding:3px 10px 3px 3px;box-shadow:0 2px 8px rgba(27,39,64,.16);min-width:0;transition:transform .12s}
.pill b{font-family:var(--display);font-weight:400;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.coin b{font-size:20px;color:#8a5a00}
.pill.bump{transform:scale(1.14)}
.pill.full{box-shadow:0 0 0 2px var(--shu),0 2px 8px rgba(27,39,64,.16)}
.pill.full b{color:var(--shu)}
.ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.ic.coin{background:radial-gradient(circle at 40% 35%,#ffe08a,var(--kin) 55%,var(--kin-d));box-shadow:inset 0 0 0 2px var(--kin-d)}
.ic.coin::after{content:"";width:9px;height:9px;border:2px solid var(--kin-d);border-radius:50%}
.ic.bag{background:var(--wood);border-radius:8px}
.pill.sand .ic.bag{background:#cdb27a}
.ic.bag::after{content:"";width:14px;height:6px;border-radius:3px;background:#d9a46e;box-shadow:0 0 0 1.5px #7a4f2a}
.hearts{display:flex;gap:2px;padding:5px 9px;background:var(--panel);border-radius:999px;box-shadow:0 2px 8px rgba(27,39,64,.16)}
.hearts i{width:13px;height:13px;background:var(--shu);clip-path:path("M6.5 12 L1 6.2 A3.2 3.2 0 0 1 6.5 2.4 A3.2 3.2 0 0 1 12 6.2 Z")}
.hearts i.off{background:#c9d2de}
.grow{flex:1}
.rbtn{pointer-events:auto;flex:none;height:34px;min-width:34px;padding:0 10px;border-radius:999px;border:0;background:var(--panel);font-family:var(--display);font-size:12px;color:var(--ink);box-shadow:0 2px 8px rgba(27,39,64,.16);cursor:pointer}
#goal{max-width:560px;width:100%;margin:0 auto;display:flex;align-items:center;gap:8px;background:var(--navy);color:#fff;border-radius:12px;padding:8px 12px;box-shadow:0 4px 14px rgba(27,39,64,.25)}
#goal .tag{flex:none;font-family:var(--display);font-size:11px;background:var(--shu);border-radius:6px;padding:3px 7px;letter-spacing:.04em}
#goal p{margin:0;font-weight:700;font-size:14px;line-height:1.4;text-wrap:balance}
#goal.gold{background:#8a5a00} #goal.gold .tag{background:var(--kin);color:#4a3306}
#goal.alert{background:var(--shu)} #goal.alert .tag{background:#fff;color:var(--shu)}
#ride{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translateX(-50%);z-index:6;border:0;border-radius:16px;background:var(--shu);color:#fff;font-family:var(--display);font-size:17px;padding:14px 26px;box-shadow:0 6px 18px rgba(229,67,42,.45),inset 0 -4px 0 rgba(0,0,0,.18);cursor:pointer;white-space:nowrap}
#ride.off{background:var(--navy);box-shadow:0 6px 18px rgba(34,53,92,.4),inset 0 -4px 0 rgba(0,0,0,.18)}
#zoom{position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:5;display:flex;flex-direction:column;gap:8px}
#zoom button{width:44px;height:44px;border-radius:50%;border:0;background:var(--panel);font-family:var(--display);font-size:22px;line-height:1;color:var(--ink);box-shadow:0 2px 8px rgba(27,39,64,.2);cursor:pointer}
#zoom button:disabled{opacity:.4;cursor:default}
#zoom button:focus-visible{outline:3px solid var(--kin);outline-offset:2px}
.warn{background:#fff4e0;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.55}
.warn b{color:var(--shu)}
#hint{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 30px);transform:translateX(-50%);background:rgba(27,39,64,.84);color:#fff;border-radius:999px;padding:10px 18px;font-weight:700;font-size:14px;pointer-events:none;white-space:nowrap;z-index:5}
#pop{opacity:0;position:fixed;left:0;right:0;top:38%;z-index:7;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding-inline:16px;text-align:center}
#pop h3{margin:0;font-family:var(--display);font-weight:400;font-size:34px;color:#fff;-webkit-text-stroke:2px var(--shu);paint-order:stroke fill;text-shadow:0 4px 0 var(--shu),0 8px 18px rgba(0,0,0,.25)}
#pop p{margin:0;background:rgba(27,39,64,.86);color:#fff;font-weight:700;border-radius:999px;padding:6px 14px;font-size:14px}
#pop.show{animation:pop 1.9s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.12)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-20px)}}
.toasts{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 104px);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:6;padding-inline:16px}
.toast{background:#fff;border-radius:10px;padding:8px 14px;font-weight:700;font-size:13px;box-shadow:0 4px 14px rgba(27,39,64,.2);border-left:4px solid var(--kin);animation:tin .25s ease-out;max-width:520px}
.toast.ok{border-left-color:var(--ok)} .toast.ng{border-left-color:var(--shu)}
@keyframes tin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.modal{position:fixed;inset:0;z-index:10;background:rgba(20,30,50,.55);display:grid;place-items:center;padding:24px 16px}
.box{touch-action:pan-y;width:100%;max-width:400px;background:#fff;border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
.box h2{margin:0;font-family:var(--display);font-weight:400;font-size:30px;color:var(--shu);text-align:center;line-height:1.2}
.box p{margin:0;line-height:1.6}
.box .lead{text-align:center;font-weight:700}
.loop{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.loop li{display:flex;gap:10px;align-items:center;background:#f2f5f9;border-radius:12px;padding:8px 10px;line-height:1.45}
.loop .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:14px}
.btn{border:0;border-radius:14px;background:var(--shu);color:#fff;font-family:var(--display);font-size:20px;min-height:56px;padding:0 18px;cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.btn.sub{background:#eef2f7;color:var(--ink);font-family:var(--body);font-weight:700;font-size:15px;min-height:46px;box-shadow:none}
.btn:focus-visible,.rbtn:focus-visible,#ride:focus-visible{outline:3px solid var(--kin);outline-offset:2px}
.fb{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;border-radius:14px;background:var(--kin);color:#4a3306;font-family:var(--display);font-size:17px;text-decoration:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.fb:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.note{font-size:12px;color:var(--mute);text-align:center}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
</style>

<canvas id="cv" aria-label="ゲーム画面。分団の町を上から見た様子"></canvas>
<div id="hud">
  <div class="row">
    <div class="pill coin" id="pCoin"><span class="ic coin"></span><b id="hCoin">0</b></div>
    <div class="pill" id="pBag"><span class="ic bag"></span><b id="hBag">0/10</b></div>
    <div class="hearts" id="hHeart" aria-label="体力"></div>
    <span class="grow"></span>
    <button class="rbtn" id="muteBtn" aria-label="音のオンオフ">音 ON</button>
    <button class="rbtn" id="menuBtn">MENU</button>
  </div>
  <div id="goal"><span class="tag" id="goalTag">目標</span><p id="goalText"></p></div>
</div>
<div id="zoom"><button id="zIn" aria-label="ズームイン">＋</button><button id="zOut" aria-label="ズームアウト">－</button></div>
<button id="ride" hidden>ポンプ車に乗る</button>
<div id="hint">指でなぞると歩くよ</div>
<div id="pop"><h3 id="popH"></h3><p id="popP"></p></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>

<script>
/* ===================== 設定 ===================== */
const KEY='bundan-survival-v3';
const RAD=[0,390,540,700,880,1060];
const CAPS=[0,10,20,35,55,80];
const MULT=[0,1,1.5,2,3];
const UP={
  axe:{name:'斧',icon:'axe',cost:[null,5,20,60,150,400],fx:l=>`木を切るのが速くなった！ 1本で木材${1+l}個`},
  bag:{name:'リュック',icon:'bag',cost:[null,8,25,70,180],fx:l=>`背中に${CAPS[l]}個まで持てる！`},
  hose:{name:'ホース',icon:'hose',cost:[null,10,30,80,200,500],fx:l=>'放水が強く、遠くまで届く！'},
  truck:{name:'ポンプ車',icon:'truck',cost:[30,100,260,650],fx:l=>l===1?'自動で火事とヒノコを消しに行く！ 近くで「乗る」もできる':'ポンプ車がパワーアップ！'},
  yagura:{name:'火の見やぐら',icon:'tower',cost:[null,50,150,400,1000],fx:l=>'町が広がった！ 木もヒノコも増える'},
  price:{name:'買取アップ',icon:'price',cost:[null,30,90,250],fx:l=>`売ったときのコインが${MULT[l]}倍！`},
  levee:{name:'堤防',icon:'levee',cost:[60,160,380],fx:l=>`堤防が${l}段高くなった！ 土嚢が少なくても町を守れる`},
  crew:{name:'団員',icon:'crew',fx:()=>'木を切って売ってくれる。コインは買取所の横にたまる'},
};
const PADS=[
  {id:'sell',x:0,y:80},
  {id:'axe',x:-250,y:84,unlock:()=>S.f.sold},
  {id:'hose',x:-160,y:84,unlock:()=>S.f.mon},
  {id:'bag',x:-205,y:164,unlock:()=>S.lv.axe>=2},
  {id:'crew',x:108,y:168,unlock:()=>S.earned>=22},
  {id:'truck',x:212,y:90,unlock:()=>S.earned>=30||S.f.ext},
  {id:'yagura',x:100,y:-118,unlock:()=>S.lv.truck>=1},
  {id:'price',x:-98,y:168,unlock:()=>S.lv.yagura>=2},
  {id:'levee',x:-290,y:-150,unlock:()=>(S.tyN||0)>=1},
];
const PADMAP=Object.fromEntries(PADS.map(p=>[p.id,p]));
const BLD=[
  {id:'tsume',x:0,y:-6,w:132,h:70,ht:40},
  {id:'shop',x:-205,y:-2,w:124,h:64,ht:32},
  {id:'garage',x:212,y:-8,w:120,h:62,ht:36},
  {id:'tower',x:0,y:-128,w:52,h:30,ht:0},
];
const PILE={x:78,y:112}, PARK={x:212,y:52}, START={x:0,y:210};
const ROOFS=['#6f86ad','#9b6b4f','#5f7d6a','#b0715f','#8a7aa8','#4f7f94'];

/* ===================== 状態 ===================== */
let S;
function fresh(){return{v:3,started:false,coins:0,frac:0,wood:0,stone:0,lv:{axe:1,bag:1,hose:1,truck:0,yagura:1,price:1,levee:0},crew:0,paid:{},f:{},earned:0,pile:0,seen:['sell'],muted:false,uz:.8,px:null,py:null,sand:0,tyN:0,tyT:null}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.v===3?s:null}catch(e){return null}}
function save(){if(S){if(!P.ride){S.px=Math.round(P.x);S.py=Math.round(P.y)}}try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){return false}}

const radius=()=>RAD[S.lv.yagura];
const cap=()=>CAPS[S.lv.bag];
const carry=()=>S.wood+S.stone;
const chopInt=()=>.32*Math.pow(.75,S.lv.axe-1);
const woodPer=()=>1+S.lv.axe;
const hosePow=()=>4*Math.pow(1.6,S.lv.hose-1);
const hoseRange=()=>86+12*S.lv.hose;
const truckPow=()=>10*Math.pow(1.7,S.lv.truck-1);
const truckRange=()=>150+20*S.lv.truck;
const truckSpeed=()=>150+25*S.lv.truck;
const crewMax=()=>1+2*S.lv.yagura;
const crewCost=()=>Math.round(15*Math.pow(1.6,S.crew));
const yl=()=>S.lv.yagura;
function padCost(id){if(id==='crew')return S.crew<crewMax()?crewCost():null;const c=UP[id].cost[S.lv[id]];return c==null?null:c}
function padRem(id){const c=padCost(id);return c==null?null:c-(S.paid[id]||0)}
const unlocked=p=>!p.unlock||p.unlock();
const padName=id=>UP[id].name;
function padLvText(id){if(id==='crew')return `${S.crew+1}人目`;if(id==='truck'&&S.lv.truck===0)return '';return 'Lv'+(S.lv[id]+1)}

/* ===================== 実行時 ===================== */
const P={x:START.x,y:START.y,face:1,moving:false,hp:5,hurt:0,since:9,ride:false,chopT:0,spray:null,full:0};
const T={x:PARK.x,y:PARK.y,face:-1,spray:null,moving:false};
let trees=[],houses=[],mons=[],drops=[],workers=[],parts=[],floats=[];
let monT=3,bossT=90,payT=0,sellT=0,pileT=0,shake=0,zoom=1,regenT=0;

/* ===================== ユーティリティ ===================== */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const active=o=>Math.hypot(o.x,o.y)<radius()-18;
function blocked(x,y){for(const b of BLD){if(Math.abs(x-b.x)<b.w/2+8&&y>b.y-b.h/2-4&&y<b.y+b.h/2+10)return true}return false}
const riverY=x=>-310+16*Math.sin(x/190);
const inRiver=(x,y)=>Math.abs(y-riverY(x))<28;
const onBridge=(x,y)=>Math.abs(x)<24&&inRiver(x,y);
const DEPOT={x:-150,y:-150};
const RIVER_HOUSES=[[-215,-210],[-62,-196],[72,-196],[162,-192],[255,-188]];
function genWorld(){
  const r=mulberry(4242);trees=[];houses=[];
  [[-48,282],[46,290],[-4,342],[78,356],[-82,350],[10,410]].forEach(p=>trees.push(mkTree(p[0],p[1])));
  for(let gx=-1100;gx<=1100;gx+=92)for(let gy=-1100;gy<=1100;gy+=92){
    const x=gx+(r()-.5)*46,y=gy+(r()-.5)*46,d=Math.hypot(x,y);if(d>1070)continue;
    if(Math.abs(x)<330&&y>-235&&y<255)continue;
    if(Math.abs(x)<140&&y>=255&&y<440)continue;
    if(Math.abs(y-riverY(x))<62)continue;
    const v=r();
    if(v<.44)trees.push(mkTree(x,y));
    else if(v<.62)houses.push({x,y,w:42+r()*14,h:34+r()*8,ht:20,roof:ROOFS[Math.floor(r()*ROOFS.length)],st:'ok',hp:0,burn:0,t:0,sm:0});
  }
  RIVER_HOUSES.forEach(([x,y],i)=>houses.push({x,y,w:46+(i%3)*5,h:36,ht:20,roof:ROOFS[i%ROOFS.length],st:'ok',hp:0,burn:0,t:0,sm:0}));
}
function mkTree(x,y){return{x,y,hp:3,st:'up',t:0,shake:0}}

/* ===================== 音 ===================== */
let AC=null;const lastS={};
function audio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function tone(f,d,type,g,slide,delay){if(!AC||S.muted)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),a=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);a.gain.setValueAtTime(g||.06,t);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
let combo=0,comboT=0;
function snd(k){if(!AC||S.muted)return;const now=performance.now();if(lastS[k]&&now-lastS[k]<45)return;lastS[k]=now;
  if(k==='chop')tone(200,.09,'triangle',.1,80);
  else if(k==='pick'){combo=Math.min(combo+1,16);comboT=.6;tone(520+combo*45,.07,'sine',.07)}
  else if(k==='coin'){combo=Math.min(combo+1,16);comboT=.6;tone(900+combo*30,.05,'square',.03);tone(1300+combo*30,.07,'square',.025,null,.04)}
  else if(k==='buy'){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'square',.05,null,i*.08))}
  else if(k==='hurt')tone(220,.22,'sawtooth',.07,70);
  else if(k==='kill'){tone(700,.12,'triangle',.08,1400);tone(300,.15,'sine',.06,120,.03)}
  else if(k==='boss'){tone(110,.5,'sawtooth',.08,70);tone(110,.5,'sawtooth',.08,70,.55)}
  else if(k==='tick')tone(1500,.03,'square',.02);
  else if(k==='new'){tone(880,.1,'sine',.06);tone(1320,.14,'sine',.06,null,.1)}
}
function buzz(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

/* ===================== 演出 ===================== */
function float(x,y,txt,col,size){floats.push({x,y,txt,col:col||'#fff',size:size||14,life:1})}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*7,s=60+Math.random()*140;parts.push({k:'conf',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-90,life:1,c:i%3===0?'#e5432a':i%3===1?c:'#22355c'})}}
function fly(item,x,y,tx,ty){parts.push({k:'fly',item,sx:x,sy:y,tx,ty,t:0,life:1})}
function toast(m,k){const el=document.createElement('div');el.className='toast '+(k||'');el.textContent=m;const b=document.getElementById('toasts');b.appendChild(el);while(b.children.length>2)b.firstChild.remove();setTimeout(()=>el.remove(),3200)}
function pop(h,p){const el=document.getElementById('pop');document.getElementById('popH').textContent=h;document.getElementById('popP').textContent=p;el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}
function bump(id){const el=document.getElementById(id);el.classList.add('bump');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('bump'),120)}

/* ===================== 物の出現 ===================== */
function drop(k,x,y,n){for(let i=0;i<n;i++){const a=Math.random()*7,s=40+Math.random()*70;drops.push({k,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,z:0,vz:120+Math.random()*80,t:0})}if(drops.length>160)drops.splice(0,drops.length-160)}
function spawnMon(boss){
  const R=radius();
  for(let i=0;i<40;i++){const a=Math.random()*Math.PI*2,d=boss?R-50:R*(.62+Math.random()*.32);const x=Math.cos(a)*d,y=Math.sin(a)*d;
    if(Math.hypot(x,y)<310)continue;if(!boss&&dist(x,y,P.x,P.y)<170)continue;
    const hp=boss?110*Math.pow(1.8,yl()-2):6*Math.pow(1.7,yl()-1);

    if(ty.t<=0){ty.ph='storm';ty.t=26;

        pop('台風が去った',S.lv.truck?'屋根の上の人を助けよう。ポンプ車が水を抜く':'屋根の上の人を助けよう')}
      else endTyphoon()}
  }else if(ty.ph==='after'){

function moveBody(o,ix,iy,sp,dt,r){
  const nx=o.x+ix*sp*dt,ny=o.y+iy*sp*dt;
  if(!blocked(nx,o.y))o.x=nx;if(!blocked(o.x,ny))o.y=ny;
  const R=radius()-(r||14),d=Math.hypot(o.x,o.y);if(d>R){o.x*=R/d;o.y*=R/d}
}
function damage(target,pw,dt){
  if(target.max!==undefined){target.hp-=pw*dt;target.hit=.08;if(target.hp<=0&&!target.dead)killMon(target)}
  else{target.hp-=pw*dt;if(target.hp<=0&&target.st==='fire')extinguish(target)}
}
function killMon(m){

  drop('stone',m.x,m.y,n);if(m.boss){drop('coin',m.x,m.y,15*yl());pop('大ヒノコ撃退！','炎の石とコインをたくさん拾おう');shake=10}

}
function extinguish(h){h.st='ok';h.burn=0;S.f.ext=true;drop('coin',h.x,h.y,3+2*yl());float(h.x,h.y-50,'ありがとう！','#fff',15);burst(h.x,h.y-20,'#3d93db',14);snd('kill')}
function spray(src,range,pw,dt){

  for(const m of mons){if(m.dead)continue;const d=dist(src.x,src.y,m.x,m.y);if(d<bd){bd=d;tg=m}}
  if(!tg)for(const h of houses){if(h.st!=='fire'||!active(h))continue;const d=dist(src.x,src.y,h.x,h.y);if(d<bd){bd=d;tg=h}}
  src.spray=tg;
  if(tg){damage(tg,pw,dt);src.face=tg.x>src.x?1:-1;
    if(Math.random()<.8)parts.push({k:'drop',src,tx:tg.x+(Math.random()-.5)*(tg.boss?50:22),ty:tg.y-(tg.boss?40:24)+(Math.random()-.5)*14,t:0,life:1,big:src===T})}

function hurt(n,from){

    P.x=START.x;P.y=START.y;P.hp=5;P.hurt=2;toast('やられた！ 詰所で復活。ホースを強くするとヒノコに勝ちやすい','ng')}
}
function update(dt){
  const [ix,iy]=input();
  if(ix||iy){if(!moved){moved=true;document.getElementById('hint').hidden=true}}
  // 移動
  if(P.ride){moveBody(T,ix,iy,truckSpeed()*1.5,dt,24);if(Math.abs(ix)>.1)T.face=ix>0?1:-1;T.moving=!!(ix||iy);P.x=T.x;P.y=T.y}
  else{moveBody(P,ix,iy,165*walkMul(),dt);if(Math.abs(ix)>.1)P.face=ix>0?1:-1;P.moving=!!(ix||iy)}
  P.hurt=Math.max(0,P.hurt-dt);P.since+=dt;
  if(P.since>4&&P.hp<5){regenT+=dt;if(regenT>2){regenT=0;P.hp++}}

  // 木を切る
  if(!P.ride){let tr=null;for(const t of trees){if(t.st==='up'&&active(t)&&dist(P.x,P.y,t.x,t.y+4)<44){tr=t;break}}
    if(tr&&carry()<cap()){P.chopT+=dt;P.chopping=tr;if(P.chopT>=chopInt()){P.chopT=0;tr.hp--;tr.shake=.15;chips(tr.x,tr.y-16);snd('chop');
      if(tr.hp<=0){tr.st='stump';tr.t=20;drop('wood',tr.x,tr.y-6,woodPer());S.f.chopped=true;shake=2}}}
    else{P.chopping=null;if(tr&&carry()>=cap()){P.full+=dt;if(P.full>1.2){P.full=0;float(P.x,P.y-60,'いっぱい！','#e5432a',14)}}}}
  for(const t of trees){t.shake=Math.max(0,t.shake-dt);if(t.st==='stump'){t.t-=dt;if(t.t<=0&&dist(P.x,P.y,t.x,t.y)>60){t.st='up';t.hp=3}}}

  // 拾う
  const mag=P.ride?130:80;
  for(let i=drops.length-1;i>=0;i--){const d=drops[i];d.t+=dt;
    if(d.z>0||d.vz>0){d.x+=d.vx*dt;d.y+=d.vy*dt;d.vz-=500*dt;d.z+=d.vz*dt;if(d.z<0){d.z=0;d.vz=d.vz<-60?-d.vz*.35:0;d.vx*=.5;d.vy*=.5}}
    if(d.t<.4)continue;
    const can=d.k==='coin'||carry()<cap();const dd=dist(d.x,d.y,P.x,P.y);
    if(can&&dd<mag){const s=380;d.x+=(P.x-d.x)/dd*s*dt;d.y+=(P.y-d.y)/dd*s*dt}
    if(can&&dd<16){
      if(d.k==='coin'){S.coins++;S.earned++;snd('coin');bump('pCoin')}else{S[d.k]++;snd('pick');bump('pBag')}
      drops.splice(i,1);continue}
    if(d.t>60)drops.splice(i,1)}
  comboT-=dt;if(comboT<=0)combo=0;

  // 売る
  const sp=PADMAP.sell;sellT+=dt;
  if(sellT>.045){sellT=0;if(dist(P.x,P.y,sp.x,sp.y)<34&&carry()>0){
    const k=S.stone>0?'stone':'wood';S[k]--;const v=(k==='stone'?3:1)*MULT[S.lv.price];S.frac+=v;const w=Math.floor(S.frac);S.frac-=w;S.coins+=w;S.earned+=w;
    fly(k,P.x,P.y-34,0,10);if(w)float(sp.x+(Math.random()-.5)*30,sp.y-40,'+'+w,'#f3b648',15);S.f.sold=true;snd('coin');bump('pCoin')}}

  // 団員のコイン
  pileT+=dt;if(pileT>.03){pileT=0;if(S.pile>=1&&dist(P.x,P.y,PILE.x,PILE.y)<36){const n=Math.max(1,Math.floor(S.pile/25));const w=Math.min(n,Math.floor(S.pile));S.pile-=w;S.coins+=w;fly('coin',PILE.x,PILE.y-10,P.x,P.y-30);snd('coin');bump('pCoin')}}

  // 買う

    for(const p of PADS){if(p.id==='sell'||!unlocked(p))continue;const c=padCost(p.id);if(c==null)continue;if(dist(P.x,P.y,p.x,p.y)>34)continue;
      const rem=c-(S.paid[p.id]||0);

      if(c-(S.paid[p.id]||0)<=0)levelUp(p.id)}}

  // 放水
  if(!P.ride)spray(P,hoseRange(),hosePow(),dt);else P.spray=null;
  // ポンプ車
  if(S.lv.truck>=1){
    if(!P.ride){
      const tg=nearest(mons.filter(m=>!m.dead).concat(houses.filter(h=>h.st==='fire'&&active(h))),T.x,T.y);
      let tx=PARK.x,ty=PARK.y,stop=6;if(tg){tx=tg.x;ty=tg.y+20;stop=truckRange()*.7}else if(zones.length){const z=nearest(zones,T.x,T.y);tx=z.x;ty=z.y+10;stop=Math.max(20,z.r*.35)}
      const d=dist(T.x,T.y,tx,ty);T.moving=d>stop;
      if(T.moving){const s=truckSpeed();T.x+=(tx-T.x)/d*s*dt;T.y+=(ty-T.y)/d*s*dt;if(Math.abs(tx-T.x)>4)T.face=tx>T.x?1:-1}
    }

  }

  // ヒノコ
  if(!S.f.mon&&(S.lv.axe>=2||S.earned>=12)){S.f.mon=true;monT=0}
  if(S.f.mon&&!ty){monT-=dt;if(monT<=0){monT=7+Math.random()*5;if(mons.filter(m=>!m.boss).length<1+yl())spawnMon()}}
  if(yl()>=2&&!ty){bossT-=dt;if(bossT<=0){bossT=150;if(!mons.some(m=>m.boss)&&spawnMon(true)){snd('boss');buzz([80,60,80]);shake=8;pop('大ヒノコ 出現！','ポンプ車で一気に消そう')}}}
  for(const m of mons){if(m.dead)continue;m.t+=dt;m.hit=Math.max(0,m.hit-dt);
    const sp=m.boss?26:44,dp=dist(m.x,m.y,P.x,P.y);let tx,ty;
    if(!P.ride&&dp<(m.boss?230:170)){tx=P.x;ty=P.y}
    else{if(!m.house||m.house.st!=='ok'||!active(m.house))m.house=nearest(houses,m.x,m.y,h=>h.st==='ok'&&active(h));if(m.house){tx=m.house.x;ty=m.house.y}else{tx=0;ty=0}}
    const d=dist(m.x,m.y,tx,ty)||1;m.x+=(tx-m.x)/d*sp*dt+Math.sin(m.t*3)*10*dt;m.y+=(ty-m.y)/d*sp*dt+Math.cos(m.t*2.4)*10*dt;

}

      cx.save();cx.translate(ex,ey);cx.rotate(ang);const pl=1+.12*Math.sin(t/150);cx.scale(pl,pl);cx.fillStyle=col;cx.strokeStyle='#22355c';cx.lineWidth=2.5;cx.beginPath();cx.moveTo(22,0);cx.lineTo(-12,-16);cx.lineTo(-5,0);cx.lineTo(-12,16);cx.closePath();cx.fill();cx.stroke();cx.restore()}}
  for(const h of houses){if(h.st!=='fire'||h===tg||!active(h))continue;const sp=toScreen(h.x,h.y);if(sp.x>0&&sp.x<W&&sp.y>140&&sp.y<H)continue;const ex=clamp(sp.x,26,W-26),ey=clamp(sp.y,160,H-40);cx.fillStyle='#e5432a';cx.beginPath();cx.arc(ex,ey,14,0,7);cx.fill();label('火',ex,ey+1,13,'#fff')}
  if(joy){cx.fillStyle='rgba(27,39,64,.12)';cx.strokeStyle='rgba(27,39,64,.3)';cx.lineWidth=2;cx.beginPath();cx.arc(joy.ox,joy.oy,52,0,7);cx.fill();cx.stroke();cx.fillStyle='rgba(229,67,42,.85)';cx.beginPath();cx.arc(joy.ox+joy.dx,joy.oy+joy.dy,22,0,7);cx.fill()}
}

/* ===================== HUD ===================== */
let hudKey='';
function hud(){
  const k=[S.coins,carry(),cap(),P.hp,S.muted,S.sand].join(',');if(k!==hudKey){hudKey=k;
    document.getElementById('hCoin').textContent=S.coins;
    document.getElementById('hBag').textContent=S.sand>0?`${S.sand}/${cap()}`:`${carry()}/${cap()}`;document.getElementById('pBag').classList.toggle('sand',S.sand>0);
    document.getElementById('pBag').classList.toggle('full',carry()>=cap());
    document.getElementById('hHeart').innerHTML=Array.from({length:5},(_,i)=>`<i class="${i<P.hp?'':'off'}"></i>`).join('');
    document.getElementById('muteBtn').textContent=S.muted?'音 OFF':'音 ON'}
  const rb=document.getElementById('ride');const show=S.lv.truck>=1&&(P.ride||dist(P.x,P.y,T.x,T.y)<80);
  rb.hidden=!show;if(show){const tx=P.ride?'ポンプ車から降りる':'ポンプ車に乗る';if(rb.textContent!==tx)rb.textContent=tx;rb.classList.toggle('off',P.ride)}
  document.getElementById('hint').hidden=moved||show;
}
document.getElementById('ride').addEventListener('click',()=>{audio();
  if(P.ride){P.ride=false;let x=T.x,y=T.y+34;if(blocked(x,y)){x=T.x;y=T.y}P.x=x;P.y=y;toast('ポンプ車は自動で火を消しに行きます')}
  else{P.ride=true;P.x=T.x;P.y=T.y;toast('ポンプ車で走ろう！ 近くの火とヒノコに自動で放水','ok')}
  snd('new')});
document.getElementById('muteBtn').addEventListener('click',()=>{audio();S.muted=!S.muted;save()});

/* ===================== モーダル ===================== */
let paused=false;
function modal(html){document.getElementById('modalRoot').innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="box">${html}</div></div>`;paused=true}
function closeModal(){document.getElementById('modalRoot').innerHTML='';paused=false;last=performance.now()}
const INAPP=/Line\/|Instagram|FBAN|FBAV|FB_IAB|Twitter|MicroMessenger|GSA\//i.test(navigator.userAgent);
const WARN=INAPP?`<div class="warn"><b>アプリの中で開いています。</b>画面が動いてしまうときは、右上や右下のメニューから「ブラウザで開く（Safariで開く）」を選ぶと快適に遊べます。</div>`:'';
const LOOP=`<ul class="loop">
<li><span class="n">1</span><span>木に近づく → 自動で切って<b>木材</b>ゲット</span></li>
<li><span class="n">2</span><span>ヒノコに近づく → 放水で倒して<b>炎の石</b>ゲット</span></li>
<li><span class="n">3</span><span>詰所の<b>買取所</b>に運ぶ → <b>コイン</b>に変わる</span></li>
<li><span class="n">4</span><span>光る丸に立つ → コインで<b>斧・ホース・ポンプ車</b>を買って強くなる</span></li>
<li><span class="n">5</span><span><b>台風</b>が来る前に、川の堤防に<b>土嚢</b>を積んで町を守ろう</span></li>
</ul>`;
function intro(){modal(`<h2>分団サバイバル</h2><p class="lead">消防団になって、町を火事から守ろう！</p>${LOOP}${WARN}<button class="btn" data-act="start">スタート</button><p class="note">画面のどこでも、指でなぞると歩きます<br>遊んだら MENU の「感想を送る」から感想を教えてね</p>`)}
function cont(){modal(`<h2>おかえり！</h2><p class="lead">前回のつづきから遊べます</p><p class="note">コイン ${S.coins}枚・やぐら Lv${S.lv.yagura}・団員 ${S.crew}人</p>${WARN}<button class="btn" data-act="close">つづきから</button><button class="btn sub" data-act="reset">はじめから</button>`)}
function menu(){modal(`<h2>メニュー</h2>${LOOP}<button class="btn" data-act="close">ゲームにもどる</button><button class="btn sub" data-act="savequit">セーブしてやめる</button><a class="fb" href="https://forms.gle/12nXo4Chy7ChWuWP6" target="_blank" rel="noopener">感想を送る（1分）</a><button class="btn sub" data-act="reset">次の人のために最初からにする</button>`)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;audio();
  if(a==='start'){S.started=true;save();closeModal()}
  else if(a==='close')closeModal();
  else if(a==='savequit'){const ok=save();modal(ok?`<h2>セーブしました</h2><p class="lead">このまま閉じてOK。次に開くと、つづきから遊べます。</p><p class="note">同じスマホ・同じブラウザで開いてね</p><button class="btn" data-act="close">ゲームにもどる</button>`:`<h2>セーブできません</h2><p>このブラウザではセーブが使えない設定になっています。Safariで開くとセーブできます。</p><button class="btn" data-act="close">ゲームにもどる</button>`)}
  else if(a==='reset'){if(b.dataset.arm){const uz=S.uz,mu=S.muted;S=fresh();S.uz=uz;S.muted=mu;S.started=true;resetWorld();save();closeModal();pop('スタート！','木に近づいてみよう')}else{b.dataset.arm='1';b.textContent='もう一度押すとリセット'}}});
document.getElementById('menuBtn').addEventListener('click',()=>{audio();menu()});

/* ===================== ループ ===================== */
let last=performance.now();
function resetWorld(){genWorld();ty=null;zones=[];for(const g of segs)g.sacks=0;mons=[];drops=[];workers=[];parts=[];floats=[];P.x=START.x;P.y=START.y;if(S.px!=null&&!blocked(S.px,S.py)&&Math.hypot(S.px,S.py)<radius()-20){P.x=S.px;P.y=S.py}P.hp=5;P.ride=false;T.x=PARK.x;T.y=PARK.y;cam.x=P.x;cam.y=P.y;monT=3;bossT=90;
  for(let i=0;i<S.crew;i++)addWorker(PADMAP.crew.x+(i%3)*12,PADMAP.crew.y);moved=false}
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  if(!paused&&!document.hidden)update(dt);
  zoom+=((P.ride?.85:1)-zoom)*Math.min(1,dt*3);
  cam.x+=(P.x-cam.x)*Math.min(1,dt*6);cam.y+=(P.y-cam.y)*Math.min(1,dt*6);
  updGuide();hud();draw(t);requestAnimationFrame(loop);
}
function boot(data){
  S=(data&&data.S)||load()||fresh();
  S.seen=S.seen||['sell'];if(S.lv.levee==null)S.lv.levee=0;if(S.tyN==null)S.tyN=0;if(S.tyT===undefined)S.tyT=null;S.sand=0;if(!S.uz)S.uz=.8;setZoom(S.uz);
  resize();addEventListener('resize',resize);resetWorld();
  if(!S.started)intro();else if(S.earned>0)cont();
  setInterval(save,3000);addEventListener('pagehide',save);document.addEventListener('visibilitychange',()=>{if(document.hidden)save();last=performance.now()});
  requestAnimationFrame(t=>{last=t;loop(t)});
}
if(window.claude&&window.claude.hot&&typeof window.claude.hot.snapshot==='function')window.claude.hot.snapshot(()=>({S}));
(window.claude&&window.claude.hot&&window.claude.hot.ready)?window.claude.hot.ready(boot):boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>
