<style>

body{position:fixed;inset:0}

function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

let AC=null;const lastS={};
function audio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function tone(f,d,type,g,slide,delay){if(!AC||S.muted)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),a=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);a.gain.setValueAtTime(g||.06,t);a.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(a).connect(AC.destination);o.start(t);o.stop(t+d+.02)}
let combo=0,comboT=0;
function snd(k){if(!AC||S.muted)return;const now=performance.now();if(lastS[k]&&now-lastS[k]<45)return;lastS[k]=now;
  if(k==='chop')tone(200,.09,'triangle',.1,80);
  else if(k==='pick'){combo=Math.min(combo+1,16);comboT=.6;tone(520+combo*45,.07,'sine',.07)}
  else if(k==='coin'){combo=Math.min(combo+1,16);comboT=.6;tone(900+combo*30,.05,'square',.03);tone(1300+combo*30,.07,'square',.025,null,.04)}
  else if(k==='buy'){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'square',.05,null,i*.08))}
  else if(k==='hurt')tone(220,.22,'sawtooth',.07,70);
  else if(k==='kill'){tone(700,.12,'triangle',.08,1400);tone(300,.15,'sine',.06,120,.03)}
  else if(k==='boss'){tone(110,.5,'sawtooth',.08,70);tone(110,.5,'sawtooth',.08,70,.55)}
  else if(k==='tick')tone(1500,.03,'square',.02);
  else if(k==='new'){tone(880,.1,'sine',.06);tone(1320,.14,'sine',.06,null,.1)}
}

function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*7,s=60+Math.random()*140;parts.push({k:'conf',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-90,life:1,c:i%3===0?'#e5432a':i%3===1?c:'#22355c'})}}
function fly(item,x,y,tx,ty){parts.push({k:'fly',item,sx:x,sy:y,tx,ty,t:0,life:1})}
function toast(m,k){const el=document.createElement('div');el.className='toast '+(k||'');el.textContent=m;const b=document.getElementById('toasts');b.appendChild(el);while(b.children.length>2)b.firstChild.remove();setTimeout(()=>el.remove(),3200)}
function pop(h,p){const el=document.getElementById('pop');document.getElementById('popH').textContent=h;document.getElementById('popP').textContent=p;el.classList.remove('show');void el.offsetWidth;el.classList.add('show')}

/* ===================== 物の出現 ===================== */
function drop(k,x,y,n){for(let i=0;i<n;i++){const a=Math.random()*7,s=40+Math.random()*70;drops.push({k,x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,z:0,vz:120+Math.random()*80,t:0})}if(drops.length>160)drops.splice(0,drops.length-160)}
function spawnMon(boss){
  const R=radius();
  for(let i=0;i<40;i++){const a=Math.random()*Math.PI*2,d=boss?R-50:R*(.62+Math.random()*.32);const x=Math.cos(a)*d,y=Math.sin(a)*d;
    if(Math.hypot(x,y)<310)continue;if(!boss&&dist(x,y,P.x,P.y)<170)continue;
    const hp=boss?110*Math.pow(1.8,yl()-2):6*Math.pow(1.7,yl()-1);
    mons.push({x,y,hp,max:hp,boss:!!boss,t:Math.random()*9,hit:0,house:null});return true}
  return false;
}
function ignite(h){h.ev=false;h.st='fire';h.hp=12*(1+.6*(yl()-1));h.burn=0;h.sm=0}

/* ===================== 購入 ===================== */
function levelUp(id){
  S.paid[id]=0;const p=PADMAP[id];burst(p.x,p.y,'#f3b648',34);snd('buy');buzz(40);shake=6;
  if(id==='box'){S.boxN=(S.boxN||0)+1;giveBox('装備屋で買った');return}
  if(id.startsWith('dc_')){const k=id.slice(3);S.dcrew=S.dcrew||{};S.dcrew[k]=(S.dcrew[k]||0)+1;addWorker(p.x,p.y,k);pop(`${UP[id].name}が入団！`,'この分団の木を切って、近くの買取所で売ってくれる');return}
  if(id==='bus'){S.lv.bus=1;pop('路線バス 開通！',UP.bus.fx());return}
  if(id.startsWith('d_')){S.lv[id]=1;pop(`${UP[id].name}を結成！`,UP[id].fx());return}
  if(VEHS.includes(id)){S.lv[id]=1;const v=VEH[id];v.x=PADMAP[id].x;v.y=PADMAP[id].y;pop(`${UP[id].name} 配備！`,UP[id].fx());return}
  if(id==='crew'){S.crew++;addWorker(p.x,p.y);pop('団員が入団！',UP.crew.fx());return}
  S.lv[id]++;const L=S.lv[id];
  if(id==='truck'&&L===1){T.x=PARK.x;T.y=PARK.y;pop('ポンプ車 登場！',UP.truck.fx(1));return}
  if(id==='yagura'){for(let i=0;i<2;i++)spawnMon();if(L===2)bossT=60}
  pop(`${UP[id].name} Lv${L}！`,UP[id].fx(L));
}

/* ===================== 団員 ===================== */
function addWorker(x,y,home){workers.push({x,y,st:'seek',tg:null,wood:0,t:0,face:1,home:home||null})}
function updWorker(w,dt){
  const sp=95,sell=PADMAP.sell;
  const move=(tx,ty,r)=>{const d=dist(w.x,w.y,tx,ty);if(d<(r||22))return true;w.x+=(tx-w.x)/d*sp*dt;w.y+=(ty-w.y)/d*sp*dt;w.face=tx>w.x?1:-1;return false};
  if(w.st==='seek'){
    if(!w.tg||w.tg.st!=='up'){let b=null,bd=1e9;for(const tr of trees){if(tr.st!=='up'||tr.fire||!active(tr))continue;const taken=workers.some(o=>o!==w&&o.tg===tr);const d=dist(w.x,w.y,tr.x,tr.y)+(taken?400:0);if(d<bd){bd=d;b=tr}}w.tg=b}
    if(!w.tg)return;if(move(w.tg.x,w.tg.y+6,24)){w.st='chop';w.t=0}
  }else if(w.st==='chop'){
    w.t+=dt;if(w.t>.9/(1+.35*wLv(w))){w.t=0;const tr=w.tg;if(tr&&tr.st==='up'){tr.hp--;tr.shake=.15;chips(tr.x,tr.y-14);if(tr.hp<=0){tr.st='stump';tr.t=20;w.wood+=2}}
      if(!tr||tr.st!=='up')w.st=w.wood>=6?'ret':'seek'}
  }else{
    if(!w.dep)w.dep=nearestDeposit(w.x,w.y);const dp=w.dep;
    if(move(dp.x,dp.y,26)){if(dp.line!=null){S.rs[dp.line].w+=w.wood;float(dp.x,dp.y-30,'+'+w.wood,'#d9a46e',12)}else if(dp.dsell){const v=Math.floor(w.wood*MULT[S.lv.price]*(1+.5*wLv(w)));S.coins+=v;S.earned+=v;float(dp.x,dp.y-30,'+'+v,'#f3b648',13)}else{const v=w.wood*MULT[S.lv.price];S.pile+=v;S.earned+=v;float(PILE.x,PILE.y-20,'+'+Math.floor(v),'#f3b648',13)}w.wood=0;w.dep=null;w.st='seek'}
  }
}
function chips(x,y){for(let i=0;i<4;i++){const a=-Math.PI/2+(Math.random()-.5)*2;parts.push({k:'chip',x,y,vx:Math.cos(a)*90,vy:Math.sin(a)*90,life:.6})}}

/* ===================== 目標 ===================== */
function nearest(list,x,y,ok){let b=null,bd=1e9;for(const o of list){if(ok&&!ok(o))continue;const d=dist(x,y,o.x,o.y);if(d<bd){bd=d;b=o}}return b}
let guide={t:'',tg:null,mode:''};
function cheapestPad(afford){let b=null,bc=1e9;for(const p of PADS){if(p.id==='sell'||!unlocked(p)||(p.lock&&p.lock()))continue;const r=padRem(p.id);if(r==null)continue;if(afford&&r>S.coins)continue;if(r<bc){bc=r;b=p}}return b}
function updGuide(){
  const tree=nearest(trees,P.x,P.y,o=>o.st==='up'&&active(o));
  const fire=nearest(houses,P.x,P.y,o=>o.st==='fire'&&active(o));
  const boss=mons.find(m=>m.boss);
  const mon=nearest(mons,P.x,P.y,m=>!m.boss);
  const sell=PADMAP.sell;let g;
  if(!S.f.chopped)g={t:'木に近づこう。自動で木を切って木材がもらえる',tg:tree};
  else if(!S.f.sold)g=carry()>0?{t:'木材を詰所の「買取所」の丸に運ぶとコインになる',tg:sell}:{t:'木に近づいて木材を集めよう',tg:tree};
  else if(hr&&P.ride!=='ladder')g={t:`高層ビル火災！ はしご車に乗って出動しよう（あと${Math.ceil(hr.t)}秒）`,tg:VEH.ladder,mode:'alert'};
  else if(hr)g={t:`高層ビルに近づくと、はしごで放水と救助ができる（あと${Math.ceil(hr.t)}秒）`,tg:{x:HRB.x,y:HRB.y},mode:'alert'};
  else if(rain&&rain.hs.some(h=>h.person)){const h=nearest(rain.hs,P.x,P.y,o=>o.person);g=P.ride==='boat'?{t:'浸水した家のそばまでボートで行こう',tg:h,mode:'alert'}:{t:`${distName('d_s')}で浸水！ 救助ボートに乗って助けよう（あと${Math.ceil(rain.t)}秒）`,tg:BOAT,mode:'alert'}}
  else if(eq&&eq.hs.some(h=>h.person)){const h=nearest(eq.hs,P.x,P.y,o=>o.person);g={t:P.ride&&dist(P.x,P.y,h.x,h.y)<150?'車から降りて、倒れた家のそばに立とう':`地震！ 倒れた家のそばに立って、取り残された人を助けよう（あと${Math.ceil(eq.t)}秒）`,tg:h,mode:'alert'}}
  else if(trees.some(t=>t.fire)){const tr=nearest(trees,P.x,P.y,o=>o.fire);g={t:'山で林野火災！ 燃え広がる前に放水で消そう',tg:tr,mode:'alert'}}
  else if(em&&S.lv.amb&&P.ride!=='amb')g={t:`救急出動！ まず救急車に乗ろう（あと${Math.ceil(em.t)}秒）`,tg:VEH.amb,mode:'alert'};
  else if(em)g={t:`救急出動！ 倒れた人のところへ急ごう（あと${Math.ceil(em.t)}秒）`,tg:em,mode:'alert'};
  else if(cheapestPad(true)){const p=cheapestPad(true);g={t:`コインで「${padName(p.id)}」が買える！ 光っている丸に立とう`,tg:p,mode:'gold'}}
  else if(boss)g={t:'大ヒノコが来た！ ポンプ車で消そう',tg:boss,mode:'alert'};
  else if(fire)g={t:'火事だ！ 近づくと放水する。消すとお礼のコインが出る',tg:fire,mode:'alert'};
  else if(P.hp<=2&&mon&&dist(P.x,P.y,mon.x,mon.y)<200)g={t:'体力が少ない！ 少し離れると回復する',tg:sell,mode:'alert'};
  else if(mon&&(!S.f.killed||dist(P.x,P.y,mon.x,mon.y)<300))g={t:'ヒノコに近づくと放水！ 倒すと「炎の石」（高く売れる）',tg:mon,mode:'alert'};
  else if(carry()>=cap()){const dp=nearestDeposit(P.x,P.y);g={t:dp.line!=null?'背中がいっぱい！ 近くのトロッコ駅に置こう':'背中がいっぱい！ 買取所でコインにかえよう',tg:dp}}
  else if(S.pile>=5)g={t:'団員が稼いだコインを受け取ろう',tg:PILE,mode:'gold'};
  else{const p=cheapestPad(false);
    if(p){const need=padRem(p.id)-S.coins;g={t:`あと ${need} コインで「${padName(p.id)}」！ 集めて売ろう`,tg:carry()>=cap()*.7?sell:(tree||sell)}}
    else g={t:'木を切ってヒノコを倒し、町を守ろう',tg:tree}}
  if(P.ride==='truck'&&T.w!=null&&T.w<tCap()*.15&&!T.conn){const ws=waterSrc(T);g={t:'ポンプ車の水が少ない！ 消火栓・防火水槽・川の近くに止めて補給しよう',tg:ws,mode:'alert'}}
  const tg2=tyGuide();if(tg2)g=tg2;
  if(wp){if(dist(P.x,P.y,wp.x,wp.y)<70){wp=null;toast('目的地に着いた')}else if(g.mode!=='alert')g={t:'地図でえらんだ場所へ向かおう',tg:wp,mode:''}}
  if(P.ride&&g.tg===tree)g.tg=null;
  guide=g;
  const el=document.getElementById('goal');el.className=g.mode||'';
  document.getElementById('goalTag').textContent=g.mode==='gold'?'コイン':g.mode==='alert'?'出動':'目標';
  const gt=document.getElementById('goalText');if(gt.textContent!==g.t)gt.textContent=g.t;
}

const VV=window.visualViewport;const zoomedIn=()=>!!(VV&&VV.scale>1.02);
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1&&zoomedIn())return;if(!e.target.closest||!e.target.closest('.box'))e.preventDefault()},{passive:false});
['gesturestart','gesturechange','dblclick'].forEach(ev=>document.addEventListener(ev,e=>{if(zoomedIn())return;e.preventDefault()},{passive:false}));
let lastTE=0;document.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTE<350&&!(e.target.closest&&e.target.closest('[data-act=shtap]'))&&e.target!==cv){e.preventDefault();const b=e.target.closest&&e.target.closest('button,a,[data-act]');if(b)b.click()}lastTE=now},{passive:false});
function resetZoom(){const m=document.querySelector('meta[name=viewport]');if(!m)return;const base='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover';m.content=base+',minimum-scale=1';setTimeout(()=>{m.content=base},120);window.scrollTo(0,0)}
function placeZoomBar(){const b=document.getElementById('zbar');if(!b)return;const z=zoomedIn();b.hidden=!z;if(!z||!VV)return;b.style.transform=`translate(${VV.offsetLeft}px,${VV.offsetTop}px) scale(${1/VV.scale})`;b.style.width=(VV.width*VV.scale)+'px'}
if(VV){VV.addEventListener('resize',placeZoomBar);VV.addEventListener('scroll',placeZoomBar)}
const keys={};let joy=null,moved=false;
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
const cv=document.getElementById('cv'),cx=cv.getContext('2d');
const ptrs=new Map();let pinch=null;
function pinchDist(){const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
cv.addEventListener('pointerdown',e=>{audio();if(AC&&AC.state==='suspended')AC.resume();cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){joy=null;pinch={d:pinchDist(),z:S.uz};return}
  if(ptrs.size===1)joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,dx:0,dy:0}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pinch&&ptrs.size===2){setZoom(pinch.z*pinchDist()/pinch.d)}});
const endPtr=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null};
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointermove',e=>{if(!joy||e.pointerId!==joy.id)return;let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const d=Math.hypot(dx,dy),m=52;if(d>m){joy.ox+=dx*(1-m/d);joy.oy+=dy*(1-m/d);dx=e.clientX-joy.ox;dy=e.clientY-joy.oy}joy.dx=dx;joy.dy=dy});
const endJoy=e=>{if(joy&&e.pointerId===joy.id)joy=null};
cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
function input(){let ix=0,iy=0;
  if(joy){const d=Math.hypot(joy.dx,joy.dy);if(d>6){ix=joy.dx/52;iy=joy.dy/52}}
  if(keys.a||keys.arrowleft)ix=-1;if(keys.d||keys.arrowright)ix=1;if(keys.w||keys.arrowup)iy=-1;if(keys.s||keys.arrowdown)iy=1;
  const m=Math.hypot(ix,iy);if(m>1){ix/=m;iy/=m}return[ix,iy]}


/* ===================== 台風・洪水 ===================== */
const SEG_X=[];for(let x=60;x<=1020;x+=120)SEG_X.push(-x,x);
const segs=SEG_X.map(x=>({x,y:riverY(x)+42,sacks:0}));
const SACK_MAX=8;
const activeSegs=()=>segs.filter(g=>Math.hypot(g.x,g.y)<radius()-20);
const segPad=g=>({x:g.x,y:g.y+40});
const segH=g=>Math.max(0,(S.lv.levee||0)-1)+Math.floor(g.sacks/2);
let ty=null,zones=[],sandT=0;
const tyWater=()=>Math.min(6,2+Math.floor((S.tyN||0)/2));
const needSacks=g=>g.danger?clamp((tyWater()-Math.max(0,(S.lv.levee||0)-1))*2,2,SACK_MAX):0;
const inZone=(x,y)=>zones.some(z=>dist(x,y,z.x,z.y)<z.r);
const walkMul=()=>(inRiver(P.x,P.y)&&!onBridge(P.x,P.y)?.25:1)*(inZone(P.x,P.y)?.65:1);
function startTyphoon(){
  em=null;hr=null;if(rain)endRain(true);if(eq){eq.hs.forEach(h=>{h.person=false;h.st='ok'});eq=null}
  ty={ph:'warn',t:75,W:tyWater(),lvl:0,flooded:new Set(),rescued:0,checked:false,boat:false};
  for(const g of segs){g.sacks=0;g.danger=false}
  if(S.lv.bousai){S.sand=cap();setTimeout(()=>toast('防災倉庫から土嚢が届いた！ 堤防に積もう','ok'),600)}
  const as=activeSegs();as.slice().sort(()=>Math.random()-.5).slice(0,Math.min(as.length,2+Math.floor((S.tyN||0)/2),5)).forEach(g=>g.danger=true);ty.atRisk=houses.filter(h=>active(h)&&h.y>riverY(h.x)&&as.some(g=>dist(h.x,h.y,g.x,g.y)<260));

  snd('boss');buzz([80,60,80]);pop('台風が接近中！','あと75秒。住民を避難所へ誘導し、危ない堤防に土嚢を積もう');
}
let evac=[];
function updEvac(dt){let lead=P;for(const e of evac){if(e.st==='wait'){if(dist(P.x,P.y,e.x,e.y)<42){e.st='follow';float(e.x,e.y-40,'ついていきます！','#fff',13);snd('new')}continue}
  if(e.st!=='follow')continue;const d=dist(e.x,e.y,lead.x,lead.y);if(d>24){const sp=Math.min(260,(d-20)*6);e.x+=(lead.x-e.x)/d*sp*dt;e.y+=(lead.y-e.y)/d*sp*dt;e.face=lead.x>e.x?1:-1}e.mv=d>26;lead=e;
  if(dist(e.x,e.y,SHELTER.x,SHELTER.y)<70){e.st='safe';ty.evN=(ty.evN||0)+1;stAdd('evac');dmAdd('evac');drop('coin',e.x,e.y,3);addMerit(2);float(e.x,e.y-40,'避難完了！','#fff',14);snd('buy')}}}

  if(!ty){
    if(S.tyT==null){if(S.earned>=60&&S.lv.yagura>=2)S.tyT=40}
    else{S.tyT-=dt;if(S.tyT<=0)startTyphoon()}

    updEvac(dt);
    sandT+=dt;
    if(sandT>.06){sandT=0;
      if(dist(P.x,P.y,DEPOT.x,DEPOT.y)<40&&S.sand<cap()){S.sand++;snd('pick');bump('pBag')}
      for(const g of activeSegs()){const pd=segPad(g);
        if(S.sand>0&&g.sacks<needSacks(g)&&dist(P.x,P.y,pd.x,pd.y)<40){S.sand--;g.sacks++;fly('sand',P.x,P.y-30,g.x,g.y-8);snd('tick');
          if(g.sacks===needSacks(g)){float(g.x,g.y-34,'OK！','#2fa86b',16);snd('new')}break}}}
    if(ty.t<=0){ty.ph='storm';ty.t=26;

  }else if(ty.ph==='storm'){

    if(el>=12&&!ty.checked){ty.checked=true;let br=0;
      for(const g of activeSegs()){if(g.danger&&segH(g)<ty.W){br++;zones.push({x:g.x,y:g.y+75,r:12,max:170,grow:true})}}
      shake=br?10:4;
      if(br){float(P.x,P.y-64,'堤防から水があふれた！','#ffd0c6',16);snd('hurt')}else{float(P.x,P.y-64,'土嚢が町を守った！','#fff',16);snd('buy')}}
    for(const z of zones){if(z.grow){z.r=Math.min(z.max,z.r+45*dt);if(z.r>=z.max)z.grow=false}
      for(const h of houses){if(h.st!=='ruin'&&h.st!=='flood'&&active(h)&&dist(h.x,h.y,z.x,z.y)<z.r){h.st='flood';ty.flooded.add(h)}}}
    if(ty.t<=0){ty.ph='after';ty.t=50;ty.lvl=0;
      const stay=new Set(evac.filter(e=>e.st!=='safe').map(e=>e.h));evac=evac.filter(e=>e.st==='safe');
      if(zones.length){const fl=[...ty.flooded].sort((a,b)=>(stay.has(b)?1:0)-(stay.has(a)?1:0));fl.slice(0,Math.min(fl.length,1+zones.length+[...stay].filter(h=>ty.flooded.has(h)).length)).forEach(h=>h.person=true);
        const z=zones.reduce((a,b)=>a.r>b.r?a:b);const a=Math.atan2(P.y-z.y,P.x-z.x);BOAT.x=z.x+Math.cos(a)*(z.r*.7);BOAT.y=z.y+Math.sin(a)*(z.r*.7);ty.boat=true;
        pop('台風が去った','救助ボートで屋根の上の人を助けよう。倒木もどかそう')}
      else if(logs.length){ty.ph='after';ty.t=40;pop('台風が去った','倒れた木をどかして道を開けよう')}
      else endTyphoon()}
  }else if(ty.ph==='after'){
    for(let i=zones.length-1;i>=0;i--){const z=zones[i];z.r-=2.5*dt;
      if(S.lv.truck>=1&&dist(T.x,T.y,z.x,z.y)<z.r+70)z.r-=(16+8*S.lv.truck)*dt;

const QZ={"kyukyu":[{"q":"倒れている人の胸を押す「<ruby>胸骨圧迫<rt>きょうこつあっぱく</rt></ruby>」。どのくらいの早さで押すのが正解？","c":["1分間に約100〜120回","1分間に約50回","1秒に3回","ゆっくり自分のペースで"],"a":0,"e":"「アンパンマンのマーチ」や「パプリカ」の曲のテンポと同じくらい、1分間に100〜120回の早さで絶え間なく押すのがポイントだよ。"},{"q":"やけどをしてしまったとき、一番最初にすることはどれ？","c":["すぐにきれいな水で冷やす","お湯で洗う","バンドエイドをはる","何もせずそのままにする"],"a":0,"e":"やけどをしたら、すぐに水道の流れる水で15分以上しっかり冷やすことが一番大切だよ。<span class=\"note\">ただし、やけどが広い<ruby>範囲<rt>はんい</rt></ruby>のときは、冷やしすぎると体が冷えて危険なんだ。まわりの大人に知らせて、すぐに119番通報しよう。</span>"},{"q":"鼻血が出たときの正しい止め方はどれ？","c":["下を向いて小鼻をしっかりつまむ","上を向いて首をトントンたたく","ティッシュをたくさん詰める","<ruby>仰向<rt>あおむ</rt></ruby>けに寝ころがる"],"a":0,"e":"上を向くと血を飲み込んで気持ち悪くなっちゃうんだ。少し下を向いて、鼻のやわらかい部分（小鼻）をしっかりつまむのが正しい止め方だよ。"},{"q":"AEDを使うとき、倒れている人の体が水や汗で濡れていたらどうする？","c":["タオルなどで胸の水分をふき取る","そのままAEDのシールを貼る","ドライヤーで乾かす","濡れている時は使わない"],"a":0,"e":"体が濡れたままだと電気がうまく伝わらないんだ。AEDに入っているタオルなどで胸の水分をふき取ってからパッド（シール）を貼ろう！"},{"q":"倒れている人を見つけたら、まずはどうやって<ruby>意識<rt>いしき</rt></ruby>があるか確かめる？","c":["肩をたたきながら声をかける","ほっぺたを強くつねる","顔に水をかける","大声で耳元で叫ぶ"],"a":0,"e":"まずは「大丈夫ですか？」と声をかけながら、両肩をトントンとたたいて反応があるか確かめよう。"},{"q":"熱中症を防ぐために、こまめに取るといいものは「水分」とあと一つは何？","c":["塩分（えんぶん）","糖分（とうぶん）","脂肪分（しぼうぶん）","鉄分（てつぶん）"],"a":0,"e":"汗をかくと水分と一緒に塩分も体から出ていってしまうんだ。お水と一緒に塩あめなどをなめて、塩分もしっかり補給しよう！"},{"q":"ごはんやおもちゃが喉に詰まって息ができなくなった人を見つけたら、背中のどこをたたく？","c":["<ruby>肩甲骨<rt>けんこうこつ</rt></ruby>（背中の羽みたいな骨）の間","腰のあたり","首のうしろ","おしり"],"a":0,"e":"肩甲骨と肩甲骨の間を、手のひらの付け根で力強く何度もたたいて（<ruby>背部叩打法<rt>はいぶこうだほう</rt></ruby>）、詰まったものを吐き出させよう。<span class=\"note\">1<ruby>歳<rt>さい</rt></ruby>より小さい赤ちゃんは、うでの上でうつぶせにして頭を低くしてから背中をたたくなど、やり方がちがうよ。まずは大人を呼んで119番通報しよう。</span>"},{"q":"AEDの電源を入れると、機械はどうなるかな？","c":["音声でやり方を教えてくれる","音楽が流れるだけ","警察に自動で電話がつながる","自分で説明書を読まないといけない"],"a":0,"e":"AEDは電源を入れると「パッドを胸に貼ってください」など、音声でやり方を全部教えてくれるから、小学生でも落ち着いて使えるんだよ。"},{"q":"救急車を呼んで待っている間、もしあれば準備しておくといいものはどれ？","c":["飲んでいるお薬や「お薬手帳」","好きなお菓子","着替えのパジャマ","暇つぶしのゲーム"],"a":0,"e":"いつも飲んでいる薬や「お薬手帳」があると、救急隊や病院の先生が正しい治療をすぐに始められるからとっても助かるんだ。"},{"q":"119番に電話をすると、消防署の人から最初に聞かれることは何かな？","c":["「火事ですか？救急ですか？」","「あなたの名前は何ですか？」","「今は何時ですか？」","「お腹は痛いですか？」"],"a":0,"e":"まずは消防車と救急車のどちらが必要かを確認するために「火事ですか？救急ですか？」と聞かれるよ。落ち着いて「救急です」と答えよう！"}],"sonae":[{"q":"グラッと<ruby>揺<rt>ゆ</rt></ruby>れを感じたら、おうちの中でまずどうする？","c":["<ruby>机<rt>つくえ</rt></ruby>の下にかくれる","外に走って<ruby>逃<rt>に</rt></ruby>げる","テレビをつける","大声で<ruby>叫<rt>さけ</rt></ruby>ぶ"],"a":0,"e":"正解！まずは自分の頭と体を守ることが一番大事だよ。<ruby>揺<rt>ゆ</rt></ruby>れがおさまるまで、机の下でダンゴムシのように丸まろう！"},{"q":"家から<ruby>逃<rt>に</rt></ruby>げるとき、<ruby>火事<rt>かじ</rt></ruby>を<ruby>防<rt>ふせ</rt></ruby>ぐために切っていくものは？","c":["ブレーカー","テレビのスイッチ","<ruby>水道<rt>すいどう</rt></ruby>の<ruby>栓<rt>せん</rt></ruby>","<ruby>冷蔵庫<rt>れいぞうこ</rt></ruby>の<ruby>電源<rt>でんげん</rt></ruby>"],"a":0,"e":"正解！電気が<ruby>復旧<rt>ふっきゅう</rt></ruby>したときに起きる「<ruby>通電火災<rt>つうでんかさい</rt></ruby>」を防ぐため、ブレーカーを落としてから逃げよう。<span class=\"note\">順番が大事。揺れている最中は身を守ることが最優先。揺れがおさまって「家を出る」と決めたときに落とすよ。揺れを感じて自動で電気を止める「感震ブレーカー」をつけておくともっと安心。</span>"},{"q":"<ruby>地震<rt>じしん</rt></ruby>のとき、外を歩いていて<ruby>危<rt>あぶ</rt></ruby>ないのはどこ？","c":["ブロック<ruby>塀<rt>べい</rt></ruby>の近く","広い公園","大きな<ruby>駐車場<rt>ちゅうしゃじょう</rt></ruby>","学校のグラウンド"],"a":0,"e":"正解！ブロック塀や<ruby>自動販売機<rt>じどうはんばいき</rt></ruby>は、揺れで倒れてくるかもしれないから、絶対に近づかないでね。"},{"q":"家族との<ruby>連絡<rt>れんらく</rt></ruby>に使う「<ruby>災害用伝言<rt>さいがいようでんごん</rt></ruby>ダイヤル」の番号は？","c":["171","119","110","104"],"a":0,"e":"正解！「イナイ（171）からかける伝言ダイヤル」と覚えてね。電話がつながりにくい時でも、家族に無事を伝えられるよ。毎月1日と15日は体験利用ができるから、家族で一度試しておこう。"},{"q":"おうちで<ruby>備蓄<rt>びちく</rt></ruby>しておくお水。1人1日あたりどれくらい必要？","c":["約3リットル","約1リットル","約500ミリリットル","約10リットル"],"a":0,"e":"正解！飲み水や料理に使う分も合わせて、1人1日3リットル。「最低3日分、できれば1週間分」が目安だよ。4人家族なら3日分で36リットル、2リットルのペットボトル18本になるね。"},{"q":"食べ物を備える「ローリングストック」ってどんな方法？","c":["<ruby>普段<rt>ふだん</rt></ruby>から食べて、食べた分を買い足す","<ruby>賞味期限<rt>しょうみきげん</rt></ruby>まで絶対に食べない","庭に<ruby>埋<rt>う</rt></ruby>めておく","<ruby>缶詰<rt>かんづめ</rt></ruby>しか買わない"],"a":0,"e":"正解！いつも食べているレトルト食品やお菓子を少し多めに買い、古いものから食べて買い足すことで、常に新しい食料を備えられるよ。"},{"q":"もしも<ruby>瓦礫<rt>がれき</rt></ruby>に<ruby>閉<rt>と</rt></ruby>じ<ruby>込<rt>こ</rt></ruby>められたら、助けを呼ぶのに一番いいアイテムは？","c":["ホイッスル（笛）","大声で叫び続ける","スマホのライト","<ruby>拍手<rt>はくしゅ</rt></ruby>をする"],"a":0,"e":"正解！大声を出し続けると体力を<ruby>消耗<rt>しょうもう</rt></ruby>しちゃうんだ。少しの息で遠くまで音が届くホイッスルをカバンにつけておこう。笛がなければ、近くの壁やパイプを硬いもので叩くのも有効だよ。"},{"q":"<ruby>寝<rt>ね</rt></ruby>ている部屋に、置かないほうがいいものはどれ？","c":["<ruby>背<rt>せ</rt></ruby>の高い家具","目覚まし時計","<ruby>懐中電灯<rt>かいちゅうでんとう</rt></ruby>","スリッパ"],"a":0,"e":"正解！寝ているときに本棚やタンスが倒れてくると逃げられなくなるよ。寝室にはなるべく大きな家具を置かず、どうしても置くなら突っ張り棒などで固定しよう。枕元にはスリッパと懐中電灯を！"},{"q":"<ruby>災害<rt>さいがい</rt></ruby>のとき、水が止まってトイレが使えなくなるかも。何を準備する？","c":["<ruby>携帯<rt>けいたい</rt></ruby>・<ruby>簡易<rt>かんい</rt></ruby>トイレ","新聞紙","たくさんのトイレットペーパー","大きなバケツ"],"a":0,"e":"正解！トイレに流せなくなるとあっという間に困ってしまうよ。便器にかぶせて使える簡易トイレを、1人1日5回×家族の人数×最低3日分を目安に用意しておこう。"},{"q":"<ruby>非常持<rt>ひじょうも</rt></ruby>ち<ruby>出<rt>だ</rt></ruby>し<ruby>袋<rt>ぶくろ</rt></ruby>の重さは、どれくらいがいい？","c":["自分が無理なく走れる重さ","30キログラム","持てるだけ全部","100グラム"],"a":0,"e":"正解！いくら荷物を詰めても、重すぎて逃げ遅れたら意味がないよ。背負ったまま走って逃げられる重さにしておこう！"}],"nyudan":[{"q":"消防団員は、ふだん何をしている人？","c":["会社員や学生など、別の仕事や学業を持つ人","消防署で24時間働くプロ","引退した元消防士だけ","市役所の職員"],"a":0,"e":"正解！消防団員は、それぞれ仕事や学業を持ちながら、火事や災害のときに出動する「地域の消防」です。消防署の職員（消防士）とは別の組織で、全国に約73万人います。"},{"q":"消防団員の身分は？","c":["非常勤の地方公務員","ボランティア（無資格）","市役所の正職員","消防署のアルバイト"],"a":0,"e":"正解！「非常勤特別職の地方公務員」として市長の承認のもと任命されます。だから報酬も出るし、活動中のケガには公務災害補償もあるんです。"},{"q":"吹田市消防団に入団できる年齢は？","c":["18歳以上","20歳以上","25歳以上","30歳以上"],"a":0,"e":"正解！条件は「吹田市に住んでいる・働いている・通学している」「18歳以上」「健康で熱意がある」の3つ。上限年齢の決まりはありません。"},{"q":"吹田市に住んでいないと入団できない？","c":["吹田市で働いていれば入団できる","住んでいないと絶対に無理","大阪府内ならどこでもOK","親が吹田市民ならOK"],"a":0,"e":"正解！他市に住んでいても、勤務先や学校が吹田市なら入団できます（機能別消防団員・勤務地団員の制度）。勤務時間中に出動することがあるので、勤め先の了承は必要です。"},{"q":"消防団員に報酬は出る？","c":["年額報酬＋出動ごとの報酬が出る","完全に無報酬のボランティア","交通費だけ出る","お弁当が出る"],"a":0,"e":"正解！吹田市では団員の年額報酬が36,500円、さらに火災出動1回4,800円〜、訓練1日3,500円などが支給されます（しおり掲載の額）。公務員の報酬なので、勤め先への届出が必要かは職場に確認してね。"},{"q":"5年以上つとめて退団すると、もらえるものは？","c":["退職報償金（団員で20万円〜）","消防車のミニカー","特になし","表彰状だけ"],"a":0,"e":"正解！5年以上つとめると、勤務年数と階級に応じて退職報償金が支給されます。団員なら5年以上で20万円、長く続けるほど増えていきます。"},{"q":"女性は消防団に入れる？","c":["入れる。火災現場にも出動する","入れるけど事務だけ","広報だけ担当","入れない"],"a":0,"e":"正解！吹田市消防団は女性も入団でき、活動内容は男性団員と同じ。火災や自然災害に出動し、ポンプ車操法大会にも出場しています。"},{"q":"大学生が消防団に入ると、就職活動で使える制度があります。その名前は？","c":["学生消防団活動認証制度","消防団インターン制度","消防推薦入社制度","そんな制度はない"],"a":0,"e":"正解！大学生・大学院生・専門学校生が吹田市消防団で1年以上活動すると、市が功績を認証する「認証状」がもらえます。エントリーシートや面接の自己PRに使えます。"},{"q":"消防団員の階級は、全部でいくつ？","c":["7つ","3つ","12つ","階級はない"],"a":0,"e":"正解！団員・班長・部長・副分団長・分団長・副団長・団長の7つ。入団するとまず「団員」からスタートです。"},{"q":"吹田市消防団は市内にいくつの分団がある？","c":["9分団","3分団","20分団","1分団"],"a":0,"e":"正解！吹一・吹二・吹三・千一・千二・豊津・岸部・山田・千里丘の9分団（＋春日班・別所班）。定員は250人。基本は住んでいる地域の分団に入りますが、希望の分団があれば相談できます。"}]};
const qQueue={};
function nextQ(bank){if(!qQueue[bank]||!qQueue[bank].length)qQueue[bank]=QZ[bank].map((_,i)=>i).sort(()=>Math.random()-.5);return QZ[bank][qQueue[bank].pop()]}
let qCur=null;
function quiz(bank,title,sub,hint,cb){
  const q=nextQ(bank),order=q.c.map((_,i)=>i).sort(()=>Math.random()-.5);qCur={q,cb,done:false,ok:false};
  modal(`<h2>${title}</h2><p class="note">${sub}</p><p class="qq">${q.q}</p><div class="qc">${order.map(i=>`<button class="qbtn" data-act="qa" data-i="${i}">${q.c[i]}</button>`).join('')}</div>${hint?'<button class="btn sub" data-act="qhint" id="qhint">救急車のヒント：まちがいを1つ消す</button>':''}<div id="qres" hidden></div>`);
}
function quizAnswer(i){if(!qCur||qCur.done)return;qCur.done=true;const q=qCur.q,ok=i===q.a;qCur.ok=ok;
  document.querySelectorAll('.qbtn').forEach(b=>{b.disabled=true;const k=+b.dataset.i;if(k===q.a)b.classList.add('ok');else if(k===i)b.classList.add('ng')});
  const h=document.getElementById('qhint');if(h)h.hidden=true;
  const r=document.getElementById('qres');r.hidden=false;r.innerHTML=`<p class="qres ${ok?'ok':'ng'}">${ok?'正解！':'ざんねん…'}</p><div class="qex">${ok?'':'正解は「'+q.c[q.a]+'」。'}${q.e}</div><button class="btn" data-act="qdone" style="margin-top:10px">つづける</button>`;
  r.scrollIntoView({block:'nearest'});snd(ok?'buy':'hurt');if(ok)buzz(30)}
function quizHint(){if(!qCur||qCur.done)return;const q=qCur.q;const wr=[...document.querySelectorAll('.qbtn')].filter(b=>+b.dataset.i!==q.a&&!b.hidden);if(wr.length>1)wr[Math.floor(Math.random()*wr.length)].hidden=true;const h=document.getElementById('qhint');if(h)h.hidden=true}
function quizDone(){const c=qCur;qCur=null;closeModal();if(c&&c.cb)c.cb(c.ok)}

let em=null,emT=40;
function updEmerg(dt){
  if(em){em.t-=dt;
    const ed=dist(P.x,P.y,em.x,em.y),need=!!S.lv.amb,arrive=need?(P.ride==='amb'&&ed<75):((!P.ride&&ed<36)||(P.ride&&ed<60));
    if(need&&!P.ride&&ed<40){em.w=(em.w||0)-dt;if(em.w<=0){em.w=2;float(em.x,em.y-50,'救急車に乗って来よう！','#ffd0c6',13)}}
    if(arrive){const e=em;em=null;
      quiz('kyukyu','救急出動！','倒れている人を助けよう。正しい答えを選んでね',!!S.lv.amb,ok=>{
        S.f.emerg=true;S.emN=(S.emN||0)+1;
        if(ok){dmAdd('emerg');const c=Math.round((8+4*yl())*(S.lv.amb?1.5:1));drop('coin',e.x,e.y,c);addMerit(5);float(e.x,e.y-50,'救命成功！','#fff',18);burst(e.x,e.y-20,'#2fa86b',24)}
        else{drop('coin',e.x,e.y,2);addMerit(1);float(e.x,e.y-50,'救急隊に引き継いだ','#fff',14)}});
      return}
    if(em.t<=0){float(em.x,em.y-40,'救急隊が病院へ運んだ','#fff',13);em=null}
    return}
  if(ty||S.lv.truck<1)return;
  if(!S.ta&&S.lv.yagura<2)return;emT-=dt;if(emT>0)return;emT=80+Math.random()*40;
  for(let k=0;k<40;k++){const a=Math.random()*7,d=150+Math.random()*(radius()-200),x=Math.cos(a)*d,y=Math.sin(a)*d;
    if(blocked(x,y)||inRiver(x,y)||dist(x,y,P.x,P.y)<180||houses.some(h=>dist(x,y,h.x,h.y)<40)||PADS.some(p=>dist(x,y,p.x,p.y)<50))continue;
    em={x,y,t:90};snd('boss');buzz([50,50,50]);if(S.lv.amb)dispatch('救急出動！ 町で人が倒れている','救急車に乗って向かおう。着いたらクイズに答えて救命',[{k:'amb',label:'救急車で出動'},{k:'walk',label:'あとで行く'}]);else toast('救急出動！ 町で人が倒れている','ng');return}
}
function rescuePerson(h){h.person=false;if(eq&&eq.hs.includes(h))eq.saved++;if(ty)ty.rescued++;addMerit(3);drop('coin',h.x,h.y,5+2*yl());float(h.x,h.y-56,'助かった！ありがとう','#fff',14);snd('kill');burst(h.x,h.y-30,'#3d93db',12)}
const VEHS=['amb','tank','ladder'];
const VEH={amb:{x:318,y:62,face:-1,moving:false,t:0},tank:{x:318,y:-28,face:-1,moving:false,t:0},ladder:{x:318,y:-118,face:-1,moving:false,t:0}};
function driveTo(v,tx,ty2,stop,sp,dt){const d=dist(v.x,v.y,tx,ty2);v.moving=d>stop;if(v.moving){v.x+=(tx-v.x)/d*sp*dt;v.y+=(ty2-v.y)/d*sp*dt;if(Math.abs(tx-v.x)>4)v.face=tx>v.x?1:-1}return !v.moving}
function updVehicles(dt){
  const A=VEH.amb,Tk=VEH.tank,L=VEH.ladder;
  if(S.lv.amb)A.lit=P.ride==='amb';
  if(S.lv.tank){const out=S.lv.truck&&dist(T.x,T.y,PARK.x,PARK.y)>40;{let gx=out?T.x-T.face*70:PADMAP.tank.x,gy=out?T.y+6:PADMAP.tank.y;const wp=viaBridge(Tk,gx,gy);if(wp){gx=wp.x;gy=wp.y}driveTo(Tk,gx,gy,wp?4:(out?30:6),out?truckSpeed()*1.4:180,dt)}Tk.lit=out}
  if(S.lv.ladder){L.lit=P.ride==='ladder';
    if(P.ride==='ladder'){if(L.w>0||L.conn){spray(L,140,8+2*yl(),dt);if(L.spray&&!L.conn)L.w=Math.max(0,L.w-6*dt)}else L.spray=null;const h=nearest(houses,L.x,L.y,o=>o.person&&o.st!=='collapsed'&&dist(o.x,o.y,L.x,L.y)<100);
      if(h){L.t+=dt;L.rt=h;if(L.t>1.5){L.t=0;rescuePerson(h);float(h.x,h.y-70,'はしごで救助！','#fff',13)}}else{L.t=0;L.rt=null}}
    else{L.t=0;L.rt=null;L.spray=null}}
}

  const on=!S.muted&&!S.bgmOff&&!document.hidden&&S.started;bgmG.gain.setTargetAtTime(on?1:0,AC.currentTime,.15);
  if(!on){bgmNext=0;return}

  if(bgmStep%8===0&&bgmChk!==bgmStep){bgmChk=bgmStep;const m=alarmOn()?'alert':isNight()?'night':'day';if(m!==bgmMode){bgmMode=m;bgmStep=0;bgmChk=0}}
  const sg=SONGS[bgmMode],st=60/sg.bpm/2;

    if(n)bnote(mf(n),bgmNext,st*1.6,sg.wave,sg.g);

/* ===================== 全分団・はしご車の水・分団ごとの災害 ===================== */
const NEWD=['d_nw','d_ne','d_sw','d_se'];
const DCENT=id=>DIST.find(d=>d.id===id);
const STATION=(()=>{const d=DCENT('d_ne');return{x:d.x,y:d.y-190}})();
const FEST=(()=>{const d=DCENT('d_se');return{x:d.x,y:d.y-210}})();
const FACPOS=[[-190,-200],[190,-210],[-300,60],[300,40]];
BLD.push({id:'station',x:STATION.x,y:STATION.y,w:150,h:44,ht:30});
function roadOf(d){const sx=d.y<0?0:(d.x<0?-600:600),sy=d.y<0?-560:140;return [sx,sy,d.x,d.y+40]}
function segD(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let q=((px-ax)*dx+(py-ay)*dy)/l;q=clamp(q,0,1);return Math.hypot(px-ax-q*dx,py-ay-q*dy)}
genWorld=(o=>function(){o();const r=mulberry(2468);const add=[];
  const ok=(x,y,d)=>dist(x,y,d.x,d.y)<500&&Math.hypot(x,y)>1090&&Math.abs(y-riverY(x))>62&&!nearDistStuff(x,y)&&dist(x,y,STATION.x,STATION.y)>120&&dist(x,y,FEST.x,FEST.y)>130;
  for(const id of NEWD){const d=DCENT(id);const step=id==='d_nw'?66:id==='d_sw'?96:84;
    if(id==='d_sw')FACPOS.forEach(([dx,dy])=>add.push({x:d.x+dx,y:d.y+dy,w:120,h:60,ht:34,roof:'#8796aa',st:'ok',hp:0,burn:0,t:0,sm:0,fac:true,dk:id}));
    for(let gx=d.x-520;gx<=d.x+520;gx+=step)for(let gy=d.y-520;gy<=d.y+520;gy+=step){const x=gx+(r()-.5)*step*.45,y=gy+(r()-.5)*step*.45;if(!ok(x,y,d))continue;
      if(id==='d_sw'&&FACPOS.some(([dx,dy])=>dist(x,y,d.x+dx,d.y+dy)<110))continue;
      if(segD(x,y,...roadOf(d))<40)continue;
      const v=r();
      if(id==='d_nw'){if(v<.58)add.push({x,y,w:36+r()*8,h:30+r()*6,ht:18,roof:['#6b4a3a','#7a5a3a','#5f4a3f','#80604a'][Math.floor(r()*4)],st:'ok',hp:0,burn:0,t:0,sm:0,old:true,dk:id});else if(v<.74)trees.push(mkTree(x,y))}
      else if(id==='d_ne'){if(v<.55)add.push({x,y,w:46+r()*12,h:34+r()*6,ht:22,roof:['#e5432a','#3d93db','#f3b648','#2fa86b','#8a7aa8'][Math.floor(r()*5)],st:'ok',hp:0,burn:0,t:0,sm:0,shop:true,dk:id});else if(v<.66)trees.push(mkTree(x,y))}
      else if(id==='d_sw'){if(v<.3)add.push({x,y,w:44,h:34,ht:20,roof:ROOFS[Math.floor(r()*ROOFS.length)],st:'ok',hp:0,burn:0,t:0,sm:0,dk:id});else if(v<.55)trees.push(mkTree(x,y))}
      else{if(v<.42)add.push({x,y,w:44+r()*12,h:34+r()*8,ht:20,roof:ROOFS[Math.floor(r()*ROOFS.length)],st:'ok',hp:0,burn:0,t:0,sm:0,dk:id});else if(v<.72)trees.push(mkTree(x,y))}}}
  houses.push(...add);
  trees=trees.filter(t=>!NEWD.some(id=>segD(t.x,t.y,...roadOf(DCENT(id)))<34&&dist(t.x,t.y,DCENT(id).x,DCENT(id).y)<560)&&dist(t.x,t.y,STATION.x,STATION.y)>110&&dist(t.x,t.y,FEST.x,FEST.y)>120&&!(DCENT('d_sw')&&FACPOS.some(([dx,dy])=>dist(t.x,t.y,DCENT('d_sw').x+dx,DCENT('d_sw').y+dy)<95)))})(genWorld);

drawVeh=(o=>function(kind,v,t){o(kind,v,t);if(kind!=='ladder'||v.w==null)return;const f=clamp(v.w/LCAP(),0,1),x=v.x-22,y=v.y-66;

/* --- 分団ごとの災害（千二・豊津・吹一・吹二） --- */
let dEv=null,devT=130;
const DEVK={d_nw:'spread',d_ne:'swarm',d_sw:'factory',d_se:'heat'};
const HEAT_TIPS=['すずしい日かげへ運ぼう','首やわきの下を冷やそう','水分と塩分をとろう','意識がないときは119番！'];
function devOpts(id,k){const o=[];if(k==='heat'){if(S.lv.amb)o.push({k:'amb',label:'救急車で出動'})}else if(S.lv.truck)o.push({k:'truck',label:'ポンプ車で出動'});return [...o,...busOpt(id),{k:'walk',label:'歩いて向かう'}]}
function startDev(id){const d=DCENT(id),k=DEVK[id],nm=d.name;
  if(k==='spread'){const c=houses.filter(h=>h.dk===id&&h.st==='ok'&&dist(h.x,h.y,d.x,d.y)<380);if(!c.length)return;const h=c[Math.floor(Math.random()*c.length)];ignite(h);h.ev=true;
    dEv={k,id,t:120,list:[h],sp:7,max:7};dispatch(`${nm}から応援要請！ 延焼火災`,'古い木造の家が多く、火がとなりの家に燃え移っていく。早く消そう！ ポンプ車はイベントの火事には自動で行きません',devOpts(id,k))}
  else if(k==='swarm'){const ms=[];for(let i=0,k=0;i<7&&k<200;k++){const a=Math.random()*Math.PI*2,rr0=440+Math.random()*60,x=d.x+Math.cos(a)*rr0,y=d.y+Math.sin(a)*rr0;if(houses.some(h=>h.st==='ok'&&dist(h.x,h.y,x,y)<90)||inRiver(x,y))continue;i++;const hp=6*Math.pow(1.7,yl()-1);const m={x,y,hp,max:hp,boss:false,t:Math.random()*9,hit:0,house:null,sw:true};mons.push(m);ms.push(m)}
    dEv={k,id,t:100,ms,killed:0};dispatch(`${nm}から応援要請！ ヒノコの大群`,'駅前の商店街にヒノコの大群が向かっている。家に火がつく前に倒そう！',devOpts(id,k))}
  else if(k==='factory'){const c=houses.filter(h=>h.fac&&h.st==='ok');if(!c.length)return;const h=c[Math.floor(Math.random()*c.length)];ignite(h);h.ev=true;h.hp=120*(1+.6*(yl()-1));h.fmax=h.hp;
    dEv={k,id,t:120,h};dispatch(`${nm}から応援要請！ 工場火災`,'大きな工場が燃えている。たくさんの水が必要！ 水がなくなったら消火栓・防火水槽で補給しながら消そう',devOpts(id,k))}
  else if(k==='heat'){const ps=[[-60,30],[70,10],[0,-60]].map(([dx,dy])=>({x:FEST.x+dx,y:FEST.y+dy,care:0,ok:false}));dEv={k,id,t:90,ps,tip:0};
    dispatch(`${nm}から応援要請！ 夏祭りで熱中症`,'具合が悪くなった人がいる。そばに行って手当てしよう（救急車だと早い）',devOpts(id,k))}
  snd('boss');buzz([80,60,80])}
function endDev(ok,msg){const e=dEv;dEv=null;devT=150+Math.random()*40;const d=DCENT(e.id);
  pop(ok?`${msg} 成功！`:`${msg} おわり`,ok?`${d.name}「応援ありがとう！」`:'次はもっと早く駆けつけよう');
  if(ok){drop('coin',P.x,P.y,15*yl());addMerit(6);support(e.id);stAdd('dev');setTimeout(()=>giveBox(`${d.name}の${msg}`),1500)}else addMerit(1)}
function updDev(dt){
  const opened=NEWD.filter(id=>S.lv[id]);if(!opened.length)return;
  if(!dEv){if(ty||hr||eq||ff||rain||em)return;devT-=dt;if(devT<=0){devT=40;startDev(opened[Math.floor(Math.random()*opened.length)])}return}
  const e=dEv;e.t-=dt;
  if(e.k==='spread'){e.sp-=dt;if(e.sp<=0){e.sp=7;const burning=e.list.filter(h=>h.st==='fire');if(e.list.length<e.max)for(const b of burning){const n=nearest(houses,b.x,b.y,h=>h.st==='ok'&&h.dk===e.id&&!e.list.includes(h)&&dist(h.x,h.y,b.x,b.y)<150);if(n){ignite(n);n.ev=true;e.list.push(n);float(n.x,n.y-50,'燃え移った！','#ffd0c6',13);break}}}
    if(!e.list.some(h=>h.st==='fire')){const lost=e.list.filter(h=>h.st==='ruin').length;endDev(lost===0,'延焼火災')}else if(e.t<=0){e.list.forEach(h=>{if(h.st==='fire'){h.st='ok';h.ev=false}});endDev(false,'延焼火災')}}
  else if(e.k==='swarm'){if(!e.ms.some(m=>!m.dead&&mons.includes(m)))endDev(e.ms.length-e.killed<=2,'ヒノコの大群 撃退');else if(e.t<=0){e.ms.forEach(m=>m.dead=true);endDev(false,'ヒノコの大群 撃退')}}
  else if(e.k==='factory'){if(e.h.st!=='fire')endDev(e.h.st==='ok','工場火災 鎮火');else if(e.t<=0){e.h.st='ok';e.h.ev=false;endDev(false,'工場火災 鎮火')}}
  else if(e.k==='heat'){const near=P.ride==='amb'?VEH.amb:(P.ride?null:P);
    for(const p of e.ps){if(p.ok)continue;if(near&&dist(near.x,near.y,p.x,p.y)<(P.ride==='amb'?70:40)){p.care+=dt*(P.ride==='amb'?2:1);if(p.care>=2){p.ok=true;addMerit(2);drop('coin',p.x,p.y,4+yl());float(p.x,p.y-50,HEAT_TIPS[e.tip++%HEAT_TIPS.length],'#fff',14);burst(p.x,p.y-20,'#2fa86b',16);snd('buy')}}}
    if(e.ps.every(p=>p.ok))endDev(true,'熱中症の手当て');else if(e.t<=0)endDev(false,'熱中症の手当て')}}
killMon=(o=>function(m){o(m);if(m.sw&&dEv&&dEv.k==='swarm')dEv.killed++})(killMon);

// 判定用に文字をそろえる：全角半角・大小文字・カタカナ→ひらがな・記号や空白を除去
function ngNorm(s){
  let t=String(s||'').normalize('NFKC').toLowerCase();
  t=t.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  return t.replace(/[\s　・･.,、。!！?？*＊_＿\-‐−―~〜～'"`´^|/\\()（）\[\]「」『』【】<>＜＞{}@#$%&+=:;○●◯◎□■☆★♪♡♥❤︎♂♀…]/g,'')}
// 英字の言いかえ（f*ck → fck、sh1t → shit など）
const ngLeet=t=>t.replace(/0/g,'o').replace(/1/g,'i').replace(/3/g,'e').replace(/4/g,'a').replace(/5/g,'s').replace(/7/g,'t').replace(/[^a-z]/g,'');
// 名前のどこかに入っていたらNG（はっきり不適切な言葉）
const NG_SUB=[
  // 暴力・脅し
  '死','殺','しねよ','しねや','しねしね','しんでしまえ','しんじまえ','ころすぞ','ころせ','ころしたる','ころしてや','ぶっころ','ぶっとば','きえろ','くたばれ','じさつ','自殺','爆破','てろりすと',
  // 悪口
  'ばかやろ','ばかやろう','あほんだら','くそ','糞','かすやろ','ぶさいく','きもい','きしょい','きっしょ','うざい','うぜえ','うぜー','ぶすやろ','でぶやろ','ちびやろ','はげやろ','馬鹿','阿呆','屑','ごみくず','ざこ','雑魚','のろま','いんきゃ','陰キャ',
  // 下品・性的
  'うんこ','うんち','ちんこ','ちんぽ','ちんちん','ちんげ','まんこ','おまんこ','おっぱい','ちくび','乳首','巨乳','爆乳','きんたま','金玉','ぺにす','せっくす','えっち','えろい','えろす','えろがき','おなに','ぱいずり','ふぇら','れいぷ','ちかん','痴漢','へんたい','変態','ぜんら','全裸','はだか','裸','淫','姦','ぱんつ','おしっこ','うんぴ','あなる','すかとろ','どうてい','童貞','しょじょ','処女','らぶほ',
  // 差別・薬物・犯罪
  'きちがい','気違い','がいじ','害児','障害者','かたわ','めくら','つんぼ','しなじん','支那','ぶらく','部落','ちょんこ','くろんぼ','にがー','にぐろ','ほもやろ','おかまやろ','まやく','麻薬','かくせいざい','覚醒剤','こかいん','大麻','売春','ばいしゅん','強盗','ごうとう','誘拐','ゆうかい','犯罪',
  // URL・連絡先っぽいもの
  'http','www'];
// 名前全体がこれと同じならNG（短いので部分一致だと普通の名前まで弾いてしまう言葉）
const NG_EXACT=['しね','しんで','ばか','ばーか','あほ','あほう','かす','くず','ごみ','ぶす','でぶ','はげ','ちび','ぼけ','まぬけ','うざ','きも','きもお','くさい','えろ','えっろ','ほも','れず','おかま','ちん','まん','ちょん','てろ','たいま','しゃぶ','ころす','しり','けつ','ちんちん','ぱんつ'];
const NG_EN=['fuck','fck','fuk','shit','bitch','dick','cock','pussy','porn','sex','nigg','nazi','rape','cunt','penis','vagina','boob','xxx','anal','killyou','killer','slut','whore','bastard','asshole','motherf','wtf','stfu','idiot','stupid','loser','retard'];
const NG_EN_EXACT=['die','kill','ass','fag','gay','hoe','sux','baka','aho','unko','unti','chinko','manko','shine','kuso','ero','hentai','oppai'];
// 「しーね」「ばっか」「うんんこ」のような崩し方もまとめて見る
function ngVariants(t){const a=t.replace(/[ーっッ]/g,''),b=a.replace(/(.)\1+/g,'$1'),c=t.replace(/(.)\1+/g,'$1');return [...new Set([t,a,b,c])]}
// 「う○こ」「ち×こ」のような伏せ字：言葉の途中の伏せた文字は何にでも一致するとみなす
const NG_MASK=/[○●◯◎×✕✖＊*□■☆★]/g;
function ngMasked(s){let m=String(s||'').normalize('NFKC').toLowerCase().replace(/[\u30a1-\u30f6]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60)).replace(NG_MASK,'\u0000');
  if(!m.includes('\u0000'))return false;m=m.replace(/[^\u0000\u3040-\u309f\u4e00-\u9fffa-z]/g,'');
  const fit=(seg,w)=>[...w].every((c,i)=>seg[i]==='\u0000'||seg[i]===c),hasReal=seg=>seg[0]!=='\u0000'&&seg[seg.length-1]!=='\u0000'; // 伏せ字は真ん中だけ（「あんぱんまん☆」の飾りは対象外）
  for(const w of NG_SUB.concat(NG_EXACT)){if(w.length<2)continue;const exact=NG_EXACT.includes(w)&&!NG_SUB.includes(w);
    if(exact){if(m.length===w.length&&hasReal(m)&&fit(m,w))return true;continue}
    for(let i=0;i+w.length<=m.length;i++){const seg=m.slice(i,i+w.length);if(seg.includes('\u0000')&&hasReal(seg)&&fit(seg,w))return true}}
  return false}
function ngName(s){
  if(ngMasked(s))return true;
  const t=ngNorm(s);if(!t)return false;
  for(const v of ngVariants(t)){
    if(NG_EXACT.includes(v))return true;
    if(NG_SUB.some(w=>v.includes(w)))return true}
  const en=ngLeet(t);
  if(en){const enc=en.replace(/(.)\1+/g,'$1');
    if(NG_EN.some(w=>en.includes(w)||enc.includes(w)))return true;
    if(NG_EN_EXACT.includes(en)||NG_EN_EXACT.includes(enc))return true}
  if(/\d{6,}/.test(t))return true; // 電話番号など
  return false}

const OPTIONAL_PAD=id=>id==='box'||id==='forge';
cheapestPad=function(afford){let b=null,bc=1e9,ob=null,oc=1e9,coreAny=false;
  for(const p of PADS){if(p.id==='sell'||!unlocked(p)||(p.lock&&p.lock()))continue;const r=padRem(p.id);if(r==null)continue;
    const opt=OPTIONAL_PAD(p.id);if(!opt)coreAny=true;if(afford&&r>S.coins)continue;
    if(opt){if(r<oc){oc=r;ob=p}}else if(r<bc){bc=r;b=p}}
  if(afford)return b||(coreAny?null:ob);return b||ob};

  if(!paused&&!document.hidden)update(dt);
  zoom+=((P.ride?.85:1)-zoom)*Math.min(1,dt*3);
